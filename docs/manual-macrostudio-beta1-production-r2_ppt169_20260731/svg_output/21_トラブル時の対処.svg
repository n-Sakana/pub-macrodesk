<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-bounds="48 44 1184 76">
    <rect x="48" y="44" width="76" height="28" rx="14" fill="#2B5C96"/>
    <text x="86" y="63" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">参考</text>
    <text x="48" y="106" font-size="40" font-weight="bold" fill="#24507F">トラブル時の対処</text>
    <line x1="48" y1="120" x2="1232" y2="120" stroke="#E2E7EC" stroke-width="1.5"/>
  </g>

  <g id="lead" data-pptx-bounds="48 134 1184 38">
    <use data-icon="tabler-filled/shield-check" x="48" y="140" width="24" height="24" fill="#3A7A47"/>
    <text x="84" y="159" font-size="20" fill="#1F2A37">いずれの状況でも、元のブックのファイルは変更されていません。状況に応じた画面へ戻って操作をやり直します。</text>
  </g>

  <g id="rescue-table" data-pptx-replace-with="table" data-pptx-bounds="48 184 1184 420">
    <metadata type="application/json">
      {
        "x": 48, "y": 184, "width": 1184, "height": 420,
        "name": "p21-rescue-table",
        "columns": ["状況", "対処"],
        "column_widths": [4.2, 5.8],
        "rows": [
          ["返答を取り込めない", "コードブロック全体をコピーし直し、もう一度取り込む（P14）"],
          ["取り込んだ内容が依頼と異なる", "［戻る］で取り込み画面へ戻り、AI に修正を依頼して新しい返答を取り込み直す。前の取り込みは全体が置き換わる"],
          ["コピー時の記号混入など軽微な崩れ", "確認画面の［手動修正］で修正し、［修正を反映］を押す（P15）"],
          ["「元のブックのマクロが、読み込んだときから変わっています」", "読み込み後に元のブックのマクロが保存し直された状態。出力は作成されていない。ブックを読み込み直し、依頼から作り直す"],
          ["「ビルドできませんでした」", "［もう一度ビルドする］を実行する。再発する場合はログを添えて配布元へ連絡する"],
          ["「時間がかかっています」", "処理は継続している。終了まで待つ"],
          ["依頼を作り直したい", "目的を選び直すと依頼番号が更新される。依頼文を AI へ送り直してから、新しい返答を取り込む"]
        ],
        "style": {"font_family": "Yu Gothic UI", "font_size": 18, "band_row": false}
      }
    </metadata>
    <rect x="48" y="184" width="1184" height="42" fill="#24507F"/>
    <text x="72" y="212" font-size="18" font-weight="bold" fill="#FFFFFF">状況</text>
    <text x="556" y="212" font-size="18" font-weight="bold" fill="#FFFFFF">対処</text>
    <rect x="48" y="226" width="1184" height="50" fill="#FFFFFF"/>
    <text x="72" y="258" font-size="18" fill="#1F2A37">返答を取り込めない</text>
    <text x="556" y="258" font-size="18" fill="#1F2A37">コードブロック全体をコピーし直し、もう一度取り込む（P14）</text>
    <rect x="48" y="276" width="1184" height="58" fill="#FAFBFC"/>
    <text x="72" y="310" font-size="18" fill="#1F2A37">取り込んだ内容が依頼と異なる</text>
    <text x="556" y="302" font-size="18" fill="#1F2A37">［戻る］で取り込み画面へ戻り、AI に修正を依頼して新しい返答を
      <tspan x="556" dy="24">取り込み直す。前の取り込みは全体が置き換わる</tspan>
    </text>
    <rect x="48" y="334" width="1184" height="50" fill="#FFFFFF"/>
    <text x="72" y="366" font-size="18" fill="#1F2A37">コピー時の記号混入など軽微な崩れ</text>
    <text x="556" y="366" font-size="18" fill="#1F2A37">確認画面の［手動修正］で修正し、［修正を反映］を押す（P15）</text>
    <rect x="48" y="384" width="1184" height="66" fill="#FAFBFC"/>
    <text x="72" y="408" font-size="18" fill="#1F2A37">「元のブックのマクロが、読み込んだ
      <tspan x="72" dy="24">ときから変わっています」</tspan>
    </text>
    <text x="556" y="408" font-size="18" fill="#1F2A37">読み込み後に元のブックのマクロが保存し直された状態。出力は
      <tspan x="556" dy="24">作成されていない。ブックを読み込み直し、依頼から作り直す</tspan>
    </text>
    <rect x="48" y="450" width="1184" height="50" fill="#FFFFFF"/>
    <text x="72" y="482" font-size="18" fill="#1F2A37">「ビルドできませんでした」</text>
    <text x="556" y="482" font-size="18" fill="#1F2A37">［もう一度ビルドする］を実行する。再発する場合はログを添えて配布元へ連絡する</text>
    <rect x="48" y="500" width="1184" height="46" fill="#FAFBFC"/>
    <text x="72" y="530" font-size="18" fill="#1F2A37">「時間がかかっています」</text>
    <text x="556" y="530" font-size="18" fill="#1F2A37">処理は継続している。終了まで待つ</text>
    <rect x="48" y="546" width="1184" height="58" fill="#FFFFFF"/>
    <text x="72" y="580" font-size="18" fill="#1F2A37">依頼を作り直したい</text>
    <text x="556" y="572" font-size="18" fill="#1F2A37">目的を選び直すと依頼番号が更新される。依頼文を AI へ送り直して
      <tspan x="556" dy="24">から、新しい返答を取り込む</tspan>
    </text>
    <rect x="48" y="184" width="1184" height="420" rx="8" fill="none" stroke="#E2E7EC" stroke-width="1.5"/>
    <line x1="540" y1="184" x2="540" y2="604" stroke="#E2E7EC" stroke-width="1"/>
  </g>

  <g id="bottom-note" data-pptx-bounds="48 618 1184 40">
    <use data-icon="tabler-filled/help-circle" x="48" y="622" width="22" height="22" fill="#5D6B7A"/>
    <text x="82" y="640" font-size="17" fill="#5D6B7A">最初からやり直す場合は右上の［最初から］を押します。動作記録は %LOCALAPPDATA%\MacroStudio\logs に保存されます（コードの本文は記録されません）。</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="48 668 1184 32">
    <text x="48" y="692" font-size="14" fill="#5D6B7A">MacroStudio 操作マニュアル（ベータ版）</text>
    <text x="1232" y="692" font-size="14" fill="#5D6B7A" text-anchor="end">21</text>
  </g>
</svg>
