  <g id="sample-note" data-pptx-bounds="48 588 1184 48">
    <text x="48" y="616" font-size="17" fill="#5D6B7A">以降の画面写真はすべてこのサンプルの実操作です。シートの内容は業務マクロを模した架空のデータで、実在の業務データは含みません。</text>
