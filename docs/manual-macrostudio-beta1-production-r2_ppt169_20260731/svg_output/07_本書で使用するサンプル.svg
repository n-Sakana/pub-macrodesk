  <g id="background" data-pptx-bounds="720 140 512 190">
    <rect x="720" y="140" width="512" height="190" rx="16" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <text x="748" y="176" font-size="22" font-weight="bold" fill="#1F2A37">改修の背景</text>
    <text x="748" y="214" font-size="18" fill="#1F2A37">このマクロは待機処理に Win32 API（kernel32 の
      <tspan x="748" dy="28">Sleep）を 19 か所で使用しています。Win32 API を</tspan>
      <tspan x="748" dy="28">使用できない端末では動作しません。</tspan>
    </text>
  </g>

  <g id="plan" data-pptx-bounds="720 354 512 160">
    <rect x="720" y="354" width="512" height="160" rx="16" fill="#F2F6FB"/>
    <text x="748" y="390" font-size="22" font-weight="bold" fill="#1F2A37">実施する改修</text>
    <text x="748" y="428" font-size="18" fill="#1F2A37">目的「Win32 API を使わない形へ直す」で AI に
      <tspan x="748" dy="28">依頼し、改修済みブックの作成と動作確認まで</tspan>
      <tspan x="748" dy="28">行います。</tspan>
