<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <defs>
    <clipPath id="shotClip08">
      <rect x="64" y="196" width="840" height="472" rx="10" ry="10"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-bounds="48 44 1184 76">
    <rect x="48" y="44" width="76" height="28" rx="14" fill="#24507F"/>
    <text x="86" y="63" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">操作</text>
    <text x="48" y="106" font-size="40" font-weight="bold" fill="#24507F">起動と画面構成</text>
    <line x1="48" y1="120" x2="1232" y2="120" stroke="#E2E7EC" stroke-width="1.5"/>
  </g>

  <g id="launch-line" data-pptx-bounds="48 134 1184 40">
    <use data-icon="tabler-filled/player-play" x="48" y="140" width="26" height="26" fill="#24507F"/>
    <text x="86" y="160" font-size="22" fill="#1F2A37">フォルダ内の <tspan font-family="Consolas,monospace" font-weight="bold">launch.vbs</tspan> をダブルクリックすると起動します。インストールは不要です。</text>
  </g>

  <g id="screenshot-annotated" data-pptx-bounds="56 188 856 496">
    <rect x="56" y="188" width="856" height="488" rx="14" fill="#F2F6FB"/>
    <image href="../images/04-book-loaded.png" x="64" y="196" width="840" height="472" preserveAspectRatio="xMidYMid meet" clip-path="url(#shotClip08)"/>
    <rect x="64" y="196" width="840" height="472" rx="10" fill="none" stroke="#E2E7EC" stroke-width="1.5"/>
    <circle cx="346" cy="211" r="15" fill="#C05B21"/>
    <text x="346" y="217" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <circle cx="500" cy="232" r="15" fill="#C05B21"/>
    <text x="500" y="238" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <circle cx="484" cy="410" r="15" fill="#C05B21"/>
    <text x="484" y="416" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <circle cx="146" cy="645" r="15" fill="#C05B21"/>
    <text x="146" y="651" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
    <circle cx="862" cy="645" r="15" fill="#C05B21"/>
    <text x="862" y="651" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  </g>

  <g id="legend" data-pptx-bounds="984 188 248 460">
    <text x="984" y="216" font-size="18" font-weight="bold" fill="#C05B21">1</text>
    <text x="1008" y="216" font-size="18" font-weight="bold" fill="#1F2A37">進捗バー</text>
    <text x="1008" y="242" font-size="16" fill="#5D6B7A">現在の手順を表示します。</text>
    <text x="984" y="292" font-size="18" font-weight="bold" fill="#C05B21">2</text>
    <text x="1008" y="292" font-size="18" font-weight="bold" fill="#1F2A37">画面の見出し</text>
    <text x="1008" y="318" font-size="16" fill="#5D6B7A">この画面で行う操作です。</text>
    <text x="984" y="368" font-size="18" font-weight="bold" fill="#C05B21">3</text>
    <text x="1008" y="368" font-size="18" font-weight="bold" fill="#1F2A37">作業領域</text>
    <text x="1008" y="394" font-size="16" fill="#5D6B7A">選択と入力はこの領域で
      <tspan x="1008" dy="24">行います。</tspan>
    </text>
    <text x="984" y="452" font-size="18" font-weight="bold" fill="#C05B21">4</text>
    <text x="1008" y="452" font-size="18" font-weight="bold" fill="#1F2A37">次にすること</text>
    <text x="1008" y="478" font-size="16" fill="#5D6B7A">次に行う操作が表示され
      <tspan x="1008" dy="24">ます。</tspan>
    </text>
    <text x="984" y="536" font-size="18" font-weight="bold" fill="#C05B21">5</text>
    <text x="1008" y="536" font-size="18" font-weight="bold" fill="#1F2A37">［戻る］［次へ］</text>
    <text x="1008" y="562" font-size="16" fill="#5D6B7A">画面の移動に使います。
      <tspan x="1008" dy="24">必要な入力が揃うと</tspan>
      <tspan x="1008" dy="24">［次へ］が有効になります。</tspan>
    </text>
  </g>

  <g id="theme-note" data-pptx-bounds="984 646 248 34">
    <text x="984" y="660" font-size="15" fill="#5D6B7A">右上のボタンで明暗切替。
      <tspan x="984" dy="22">［最初から］で全状態を破棄。</tspan>
    </text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="48 668 900 32">
