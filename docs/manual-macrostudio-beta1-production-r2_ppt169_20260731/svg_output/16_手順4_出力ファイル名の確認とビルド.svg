<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <defs>
    <clipPath id="shotClip16a">
      <rect x="56" y="158" width="560" height="315" rx="10" ry="10"/>
    </clipPath>
    <clipPath id="shotClip16b">
      <rect x="664" y="158" width="560" height="315" rx="10" ry="10"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-bounds="48 44 1184 76">
    <rect x="48" y="44" width="76" height="28" rx="14" fill="#24507F"/>
    <text x="86" y="63" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">操作</text>
    <rect x="132" y="44" width="92" height="28" rx="14" fill="#FFFFFF" stroke="#24507F" stroke-width="1.5"/>
    <text x="178" y="63" font-size="14" font-weight="bold" fill="#24507F" text-anchor="middle">手順 4</text>
    <text x="48" y="106" font-size="40" font-weight="bold" fill="#24507F">作成する改修済みブックを確認します</text>
    <line x1="48" y1="120" x2="1232" y2="120" stroke="#E2E7EC" stroke-width="1.5"/>
  </g>

  <g id="shot-name" data-pptx-bounds="48 150 576 372">
    <rect x="48" y="150" width="576" height="331" rx="14" fill="#F2F6FB"/>
    <image href="../images/19-output-name.png" x="56" y="158" width="560" height="315" preserveAspectRatio="xMidYMid meet" clip-path="url(#shotClip16a)"/>
    <rect x="56" y="158" width="560" height="315" rx="10" fill="none" stroke="#E2E7EC" stroke-width="1.5"/>
    <text x="56" y="507" font-size="16" fill="#5D6B7A">書き戻し 5（うち新規追加 1）・元ブック保持の集計が表示されます。</text>
  </g>

  <g id="shot-building" data-pptx-bounds="656 150 576 372">
    <rect x="656" y="150" width="576" height="331" rx="14" fill="#F2F6FB"/>
    <image href="../images/20-building.png" x="664" y="158" width="560" height="315" preserveAspectRatio="xMidYMid meet" clip-path="url(#shotClip16b)"/>
    <rect x="664" y="158" width="560" height="315" rx="10" fill="none" stroke="#E2E7EC" stroke-width="1.5"/>
    <text x="664" y="507" font-size="16" fill="#5D6B7A">ビルド中の画面。書き戻し後の読み直し検証まで自動で実行されます。</text>
  </g>

  <g id="steps" data-pptx-bounds="48 532 1184 104">
    <circle cx="65" cy="552" r="15" fill="#24507F"/>
    <text x="65" y="558" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="94" y="560" font-size="20" fill="#1F2A37">出力ファイル名を確認します。既定値は「<tspan font-family="Consolas,monospace" font-size="18">sample_win32_sleep-Modified-20260731.xlsm</tspan>」のように</text>
    <text x="94" y="590" font-size="20" fill="#1F2A37">「元の名前-Modified-日付」です（日付はブックを読み込んだ日）。ファイル名のみ変更でき、拡張子は変更できません。</text>
    <circle cx="65" cy="622" r="15" fill="#24507F"/>
    <text x="65" y="628" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="94" y="630" font-size="20" fill="#1F2A37">［次へ］でビルドが開始されます（通常は数秒）。「時間がかかっています」と表示された場合も処理は継続しています。</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="48 668 1184 32">
    <text x="48" y="692" font-size="14" fill="#5D6B7A">MacroStudio 操作マニュアル（ベータ版）</text>
    <text x="1232" y="692" font-size="14" fill="#5D6B7A" text-anchor="end">16</text>
  </g>
</svg>
