  <g id="flow-arrows" data-pptx-bounds="300 240 628 34">
    <g id="p06-arrow-300" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="rightArrow" data-pptx-frame="300 240 36 34" fill="#2B5C96" stroke="none">
      <path d="M 300 248.5 L 319 248.5 L 319 240 L 336 257 L 319 274 L 319 265.5 L 300 265.5 Z"/>
    </g>
    <g id="p06-arrow-596" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="rightArrow" data-pptx-frame="596 240 36 34" fill="#2B5C96" stroke="none">
      <path d="M 596 248.5 L 615 248.5 L 615 240 L 632 257 L 615 274 L 615 265.5 L 596 265.5 Z"/>
    </g>
    <g id="p06-arrow-892" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="rightArrow" data-pptx-frame="892 240 36 34" fill="#2B5C96" stroke="none">
      <path d="M 892 248.5 L 911 248.5 L 911 240 L 928 257 L 911 274 L 911 265.5 L 892 265.5 Z"/>
    </g>
  </g>

  <g id="branch-note" data-pptx-bounds="48 476 1184 76">
    <rect x="48" y="476" width="1184" height="76" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <use data-icon="tabler-filled/search" x="76" y="500" width="26" height="26" fill="#2B5C96"/>
    <text x="116" y="522" font-size="19" fill="#1F2A37">「AIで相談する」を選んだ場合は、手順 2 で完了になります（P20）。</text>
  </g>

  <g id="back-note" data-pptx-bounds="48 576 1184 48">
    <use data-icon="tabler-filled/circle-arrow-right" x="48" y="584" width="24" height="24" fill="#24507F"/>
    <text x="84" y="603" font-size="19" fill="#5D6B7A">［戻る］で通過した画面へ戻れます。ビルド中の画面のみ戻れません。</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="48 668 1184 32">
    <text x="48" y="692" font-size="14" fill="#5D6B7A">MacroStudio 操作マニュアル（ベータ版）</text>
    <text x="1232" y="692" font-size="14" fill="#5D6B7A" text-anchor="end">06</text>
