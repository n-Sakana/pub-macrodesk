<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-bounds="48 44 1184 76">
    <rect x="48" y="44" width="76" height="28" rx="14" fill="#24507F"/>
    <text x="86" y="63" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">操作</text>
    <text x="48" y="106" font-size="40" font-weight="bold" fill="#24507F">作業全体の流れ</text>
    <line x1="48" y1="120" x2="1232" y2="120" stroke="#E2E7EC" stroke-width="1.5"/>
  </g>

  <g id="lead" data-pptx-bounds="48 138 1184 40">
    <text x="48" y="166" font-size="24" fill="#1F2A37">改修は 4 つの手順で構成されます。画面は 1 つずつ進み、必要な入力が揃うと［次へ］が有効になります。</text>
  </g>

  <g id="flow-step-1" data-pptx-bounds="48 200 248 240">
    <rect x="48" y="200" width="248" height="240" rx="16" fill="#F2F6FB"/>
    <circle cx="90" cy="242" r="20" fill="#24507F"/>
    <text x="90" y="250" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="124" y="250" font-size="22" font-weight="bold" fill="#1F2A37">作業とブック
      <tspan x="124" dy="28">を選ぶ</tspan>
    </text>
    <text x="76" y="330" font-size="17" fill="#5D6B7A">・作業を選ぶ
      <tspan x="76" dy="28">・ブックを読み込む</tspan>
      <tspan x="76" dy="28">・読み取り結果を確認</tspan>
    </text>
  </g>

  <g id="flow-step-2" data-pptx-bounds="344 200 248 240">
    <rect x="344" y="200" width="248" height="240" rx="16" fill="#F2F6FB"/>
    <circle cx="386" cy="242" r="20" fill="#24507F"/>
    <text x="386" y="250" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="420" y="250" font-size="22" font-weight="bold" fill="#1F2A37">AIへ依頼する</text>
    <text x="372" y="330" font-size="17" fill="#5D6B7A">・目的を選ぶ
      <tspan x="372" dy="28">・依頼文を確認</tspan>
      <tspan x="372" dy="28">・AIチャットへ渡す</tspan>
    </text>
  </g>

  <g id="flow-step-3" data-pptx-bounds="640 200 248 240">
    <rect x="640" y="200" width="248" height="240" rx="16" fill="#F2F6FB"/>
    <circle cx="682" cy="242" r="20" fill="#24507F"/>
    <text x="682" y="250" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="716" y="250" font-size="22" font-weight="bold" fill="#1F2A37">返答を
      <tspan x="716" dy="28">取り込む</tspan>
    </text>
