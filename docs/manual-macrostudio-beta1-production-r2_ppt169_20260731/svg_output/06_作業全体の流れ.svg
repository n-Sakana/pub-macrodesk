    <text x="1012" y="250" font-size="22" font-weight="bold" fill="#1F2A37">ブックを作る</text>
    <text x="964" y="330" font-size="17" fill="#5D6B7A">・出力名を確認
      <tspan x="964" dy="28">・ビルド（自動）</tspan>
      <tspan x="964" dy="28">・完了</tspan>
    </text>
