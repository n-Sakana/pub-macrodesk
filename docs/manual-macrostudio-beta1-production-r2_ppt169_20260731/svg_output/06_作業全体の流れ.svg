      <tspan x="668" dy="28">・変更内容を確認</tspan>
    </text>
  </g>

  <g id="flow-step-4" data-pptx-bounds="936 200 248 240">
    <rect x="936" y="200" width="248" height="240" rx="16" fill="#F2F6FB"/>
    <circle cx="978" cy="242" r="20" fill="#24507F"/>
