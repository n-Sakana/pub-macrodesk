<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-bounds="48 44 1184 76">
    <rect x="48" y="44" width="76" height="28" rx="14" fill="#24507F"/>
    <text x="86" y="63" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">概要</text>
    <text x="48" y="106" font-size="40" font-weight="bold" fill="#24507F">本書の構成</text>
    <line x1="48" y1="120" x2="1232" y2="120" stroke="#E2E7EC" stroke-width="1.5"/>
  </g>

  <g id="section-overview" data-pptx-bounds="48 152 1184 88">
    <rect x="48" y="152" width="1184" height="88" rx="12" fill="#F2F6FB"/>
    <rect x="72" y="176" width="96" height="36" rx="18" fill="#24507F"/>
    <text x="120" y="200" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">概要</text>
    <text x="192" y="192" font-size="22" font-weight="bold" fill="#1F2A37">MacroStudioの役割分担・作業の種類と成果物・保護機能</text>
    <text x="192" y="222" font-size="17" fill="#5D6B7A">操作の前に把握しておく内容です。</text>
    <text x="1208" y="202" font-size="18" fill="#5D6B7A" text-anchor="end">P03–05</text>
  </g>

  <g id="section-operation" data-pptx-bounds="48 248 1184 88">
    <rect x="48" y="248" width="1184" height="88" rx="12" fill="#F2F6FB"/>
    <rect x="72" y="272" width="96" height="36" rx="18" fill="#24507F"/>
    <text x="120" y="296" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">操作</text>
    <text x="192" y="288" font-size="22" font-weight="bold" fill="#1F2A37">サンプルブックを使った改修の全手順</text>
    <text x="192" y="318" font-size="17" fill="#5D6B7A">ブックの読み込みから、改修済みブックの作成と動作確認までを順に説明します。</text>
    <text x="1208" y="298" font-size="18" fill="#5D6B7A" text-anchor="end">P06–19</text>
  </g>

  <g id="section-consult" data-pptx-bounds="48 344 1184 76">
    <rect x="48" y="344" width="1184" height="76" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <rect x="72" y="364" width="96" height="36" rx="18" fill="#2B5C96"/>
    <text x="120" y="388" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">相談</text>
    <text x="192" y="392" font-size="22" font-weight="bold" fill="#1F2A37">「AIで相談する」の操作
      <tspan font-size="17" font-weight="normal" fill="#5D6B7A">　ブックを変更せずに、診断や質問を行う場合の手順です。</tspan>
    </text>
    <text x="1208" y="392" font-size="18" fill="#5D6B7A" text-anchor="end">P20</text>
  </g>

  <g id="section-reference" data-pptx-bounds="48 428 1184 76">
    <rect x="48" y="428" width="1184" height="76" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <rect x="72" y="448" width="96" height="36" rx="18" fill="#2B5C96"/>
    <text x="120" y="472" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">参考</text>
    <text x="192" y="476" font-size="22" font-weight="bold" fill="#1F2A37">トラブル時の対処・動作要件と仕組み</text>
    <text x="1208" y="476" font-size="18" fill="#5D6B7A" text-anchor="end">P21–22</text>
  </g>

  <g id="premise" data-pptx-bounds="48 540 1184 84">
    <rect x="48" y="540" width="1184" height="84" rx="12" fill="#FFFFFF" stroke="#E2E7EC" stroke-width="1.5"/>
    <text x="76" y="574" font-size="19" fill="#1F2A37">操作の説明は、P07 のサンプルブックで通して行います。</text>
    <text x="76" y="604" font-size="19" fill="#1F2A37">本書で引用する画面の見出し・ボタン名・案内文は、実際の表示と同一です。</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="48 668 1184 32">
    <text x="48" y="692" font-size="14" fill="#5D6B7A">MacroStudio 操作マニュアル（ベータ版）</text>
    <text x="1232" y="692" font-size="14" fill="#5D6B7A" text-anchor="end">02</text>
  </g>
</svg>
