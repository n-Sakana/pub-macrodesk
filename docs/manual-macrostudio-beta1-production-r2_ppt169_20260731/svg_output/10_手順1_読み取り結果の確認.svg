<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <defs>
    <clipPath id="shotClip10a">
      <rect x="56" y="158" width="560" height="315" rx="10" ry="10"/>
    </clipPath>
    <clipPath id="shotClip10b">
      <rect x="664" y="158" width="560" height="315" rx="10" ry="10"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-bounds="48 44 1184 76">
    <rect x="48" y="44" width="76" height="28" rx="14" fill="#24507F"/>
    <text x="86" y="63" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">操作</text>
    <rect x="132" y="44" width="92" height="28" rx="14" fill="#FFFFFF" stroke="#24507F" stroke-width="1.5"/>
    <text x="178" y="63" font-size="14" font-weight="bold" fill="#24507F" text-anchor="middle">手順 1</text>
    <text x="48" y="106" font-size="40" font-weight="bold" fill="#24507F">読み込んだマクロを確認します</text>
    <line x1="48" y1="120" x2="1232" y2="120" stroke="#E2E7EC" stroke-width="1.5"/>
  </g>

  <g id="shot-summary" data-pptx-bounds="48 150 576 366">
    <rect x="48" y="150" width="576" height="331" rx="14" fill="#F2F6FB"/>
    <image href="../images/05-read.png" x="56" y="158" width="560" height="315" preserveAspectRatio="xMidYMid meet" clip-path="url(#shotClip10a)"/>
    <rect x="56" y="158" width="560" height="315" rx="10" fill="none" stroke="#E2E7EC" stroke-width="1.5"/>
    <text x="56" y="505" font-size="16" fill="#5D6B7A">「8モジュール・484行を読み込みました」の件数表示。確認して［次へ］で進みます。</text>
  </g>

  <g id="shot-detail" data-pptx-bounds="656 150 576 366">
    <rect x="656" y="150" width="576" height="331" rx="14" fill="#F2F6FB"/>
    <image href="../images/06-read-open.png" x="664" y="158" width="560" height="315" preserveAspectRatio="xMidYMid meet" clip-path="url(#shotClip10b)"/>
    <rect x="664" y="158" width="560" height="315" rx="10" fill="none" stroke="#E2E7EC" stroke-width="1.5"/>
    <text x="664" y="505" font-size="16" fill="#5D6B7A">「読み取った内容を見る」を開くと、モジュール名と行数を確認できます。</text>
  </g>

  <g id="notice-lead" data-pptx-bounds="48 520 1184 28">
    <text x="48" y="541" font-size="18" fill="#1F2A37">読み取り時に案内が表示される場合があります。意味は次の 2 種類で、いずれも読み込みは成功しています。</text>
  </g>

  <g id="notice-info" data-pptx-bounds="48 552 580 104">
    <rect x="48" y="552" width="580" height="104" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <text x="72" y="580" font-size="17" font-weight="bold" fill="#1F2A37">「マクロのコードは全モジュール読み取れています。」</text>
    <text x="72" y="608" font-size="16" fill="#5D6B7A">ブック内部の管理情報が標準と異なっていた場合の表示です。
      <tspan x="72" dy="24">コードはすべて読み取れており、対処は不要です。</tspan>
    </text>
  </g>

  <g id="notice-warn" data-pptx-bounds="652 552 580 104">
    <rect x="652" y="552" width="580" height="104" rx="12" fill="#FFFFFF" stroke="#C05B21" stroke-width="1.5"/>
    <text x="676" y="580" font-size="17" font-weight="bold" fill="#1F2A37">「一部をバイナリレベルで読み取れませんでした。」</text>
    <text x="676" y="608" font-size="16" fill="#5D6B7A">コードが最後まで読み取れたかを、アプリ側で確定できなかった場合の表示です。
      <tspan x="676" dy="24">念のため、P15 の差分確認で改修前コードの途切れがないか確認します。</tspan>
    </text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="48 668 1184 32">
    <text x="48" y="692" font-size="14" fill="#5D6B7A">MacroStudio 操作マニュアル（ベータ版）</text>
    <text x="1232" y="692" font-size="14" fill="#5D6B7A" text-anchor="end">10</text>
  </g>
</svg>
