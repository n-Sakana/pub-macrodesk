  <g id="definition" data-pptx-bounds="48 140 1184 76">
    <text x="48" y="168" font-size="22" fill="#1F2A37">MacroStudio は、Excel マクロ（VBA）を、VBE（開発画面）を開かずに確認・診断・改修するためのツールです。</text>
    <text x="48" y="202" font-size="22" fill="#1F2A37">改修内容の判断は行わず、チャット AI との受け渡しと検証を担当します。</text>
  </g>

  <g id="role-ai" data-pptx-bounds="48 240 368 300">
    <rect x="48" y="240" width="368" height="300" rx="16" fill="#F2F6FB" />
    
  <g transform="translate(80, 268) scale(1.33333)" fill="#24507F">
