<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <g id="header" data-pptx-bounds="48 44 1184 76">
    <rect x="48" y="44" width="76" height="28" rx="14" fill="#24507F" />
    <text x="86" y="63" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">概要</text>
    <text x="48" y="106" font-size="40" font-weight="bold" fill="#24507F">アプリの保護機能と、利用者が確認する範囲</text>
    <line x1="48" y1="120" x2="1232" y2="120" stroke="#E2E7EC" stroke-width="1.5" />
  </g>

  <g id="protections" data-pptx-bounds="48 140 700 400">
    <rect x="48" y="140" width="700" height="400" rx="16" fill="#F2F6FB" />
    
  <g transform="translate(76, 164) scale(1.16667)" fill="#24507F">
    <path d="M11.998 2l.118 .007l.059 .008l.061 .013l.111 .034a.993 .993 0 0 1 .217 .112l.104 .082l.255 .218a11 11 0 0 0 7.189 2.537l.342 -.01a1 1 0 0 1 1.005 .717a13 13 0 0 1 -9.208 16.25a1 1 0 0 1 -.502 0a13 13 0 0 1 -9.209 -16.25a1 1 0 0 1 1.005 -.717a11 11 0 0 0 7.531 -2.527l.263 -.225l.096 -.075a.993 .993 0 0 1 .217 -.112l.112 -.034a.97 .97 0 0 1 .119 -.021l.115 -.007zm3.71 7.293a1 1 0 0 0 -1.415 0l-3.293 3.292l-1.293 -1.292l-.094 -.083a1 1 0 0 0 -1.32 1.497l2 2l.094 .083a1 1 0 0 0 1.32 -.083l4 -4l.083 -.094a1 1 0 0 0 -.083 -1.32z" />
  </g>
    <text x="116" y="186" font-size="23" font-weight="bold" fill="#1F2A37">アプリの保護機能</text>
    <text x="76" y="232" font-size="19" fill="#1F2A37">1　元のブックのファイルには書き込みません。出力は常に別ファイルです。</text>
    <text fill="#1F2A37" font-size="19" x="76" y="284">2　コードを外部へ自動送信しません。MacroStudio は通信機能を持たず、
      </text><text fill="#1F2A37" font-size="19" x="104" y="312"><tspan>受け渡しは利用者の操作で行われます。</tspan>
    </text><text fill="#1F2A37" font-size="19" x="76" y="364">3　ビルド開始時に、読み込み時点と元のブックの VBA が一致することを
      </text><text fill="#1F2A37" font-size="19" x="104" y="392"><tspan>確認します。不一致の場合は中止し、出力を作りません。</tspan>
    </text><text fill="#1F2A37" font-size="19" x="76" y="444">4　書き戻したブックを読み直し、取り込んだコードがそのとおり
      </text><text fill="#1F2A37" font-size="19" x="104" y="472"><tspan>書き込まれ、それ以外が変更されていないことを照合します。</tspan>
      </text><text fill="#1F2A37" font-size="19" x="104" y="500"><tspan>照合するのは書き込みの正確さであり、マクロの動作は確認しません。</tspan>
      </text><text fill="#1F2A37" font-size="19" x="104" y="528"><tspan>照合に失敗した場合は、出力ファイルを削除します。</tspan>
    </text></g>

  <g id="not-verified" data-pptx-bounds="780 140 452 226">
    <rect x="780" y="140" width="452" height="226" rx="16" fill="#FFFFFF" stroke="#C05B21" stroke-width="2" />
    
  <g transform="translate(808, 164) scale(1.16667)" fill="#C05B21">
    <path d="M12 1.67c.955 0 1.845 .467 2.39 1.247l.105 .16l8.114 13.548a2.914 2.914 0 0 1 -2.307 4.363l-.195 .008h-16.225a2.914 2.914 0 0 1 -2.582 -4.2l.099 -.185l8.11 -13.538a2.914 2.914 0 0 1 2.491 -1.403zm.01 13.33l-.127 .007a1 1 0 0 0 0 1.986l.117 .007l.127 -.007a1 1 0 0 0 0 -1.986l-.117 -.007zm-.01 -7a1 1 0 0 0 -.993 .883l-.007 .117v4l.007 .117a1 1 0 0 0 1.986 0l.007 -.117v-4l-.007 -.117a1 1 0 0 0 -.993 -.883z" />
  </g>
    <text x="848" y="186" font-size="23" font-weight="bold" fill="#1F2A37">検証しない範囲</text>
    <text fill="#1F2A37" font-size="19" x="808" y="230">AI の返答の内容、つまり改修後の
      </text><text fill="#1F2A37" font-size="19" x="808" y="260"><tspan>マクロが業務要件どおり動作するか</tspan>
      </text><text fill="#1F2A37" font-size="19" x="808" y="290"><tspan>は、アプリでは検証できません。</tspan>
    </text></g>

  <g id="user-checks" data-pptx-bounds="780 382 452 158">
    <rect x="780" y="382" width="452" height="158" rx="16" fill="#F2F6FB" />
    
  <g transform="translate(808, 406) scale(1.16667)" fill="#24507F">
    <path d="M17 3.34a10 10 0 1 1 -14.995 8.984l-.005 -.324l.005 -.324a10 10 0 0 1 14.995 -8.336zm-1.293 5.953a1 1 0 0 0 -1.32 -.083l-.094 .083l-3.293 3.292l-1.293 -1.292l-.094 -.083a1 1 0 0 0 -1.403 1.403l.083 .094l2 2l.094 .083a1 1 0 0 0 1.226 0l.094 -.083l4 -4l.083 -.094a1 1 0 0 0 -.083 -1.32z" />
  </g>
    <text x="848" y="428" font-size="23" font-weight="bold" fill="#1F2A37">利用者が確認すること</text>
    <text x="808" y="472" font-size="19" fill="#1F2A37">・取り込んだ変更の差分確認（P15）</text>
    <text x="808" y="506" font-size="19" fill="#1F2A37">・Excel での動作確認（P18）</text>
  </g>

  <g id="recover-fact" data-pptx-bounds="48 566 1184 74">
    <rect x="48" y="566" width="1184" height="74" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1" />
    <text x="76" y="596" font-size="19" fill="#1F2A37">途中で中止した場合も、ビルドに失敗した場合も、元のブックは読み込み時のままです。</text>
    <text x="76" y="624" font-size="19" fill="#1F2A37">操作は最初からやり直せます。</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="48 668 1184 32">
    <text x="48" y="692" font-size="14" fill="#5D6B7A">MacroStudio 操作マニュアル（ベータ版）</text>
    <text x="1232" y="692" font-size="14" fill="#5D6B7A" text-anchor="end">05</text>
  </g>
</svg>