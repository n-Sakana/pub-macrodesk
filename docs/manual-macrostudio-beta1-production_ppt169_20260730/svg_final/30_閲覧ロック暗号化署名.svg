<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <g id="header" data-pptx-bounds="48 44 1184 76">
    <rect x="48" y="44" width="76" height="28" rx="14" fill="#24507F" />
    <text x="86" y="63" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">第5部</text>
    <text x="48" y="106" font-size="40" font-weight="bold" fill="#24507F">閲覧ロック・暗号化・署名</text>
    <line x1="48" y1="120" x2="1232" y2="120" stroke="#E2E7EC" stroke-width="1.5" />
  </g>

  <g id="lead" data-pptx-bounds="48 136 1184 36">
    <text x="48" y="162" font-size="22" fill="#1F2A37">似ていて紛らわしい 3 つの保護は、扱いがそれぞれ違います。</text>
  </g>

  <g id="card-lock" data-pptx-bounds="48 190 368 400">
    <rect x="48" y="190" width="368" height="400" rx="16" fill="#F2F6FB" />
    
  <g transform="translate(76, 216) scale(1.25)" fill="#24507F">
    <path d="M12 2a5 5 0 0 1 5 5v3a3 3 0 0 1 3 3v6a3 3 0 0 1 -3 3h-10a3 3 0 0 1 -3 -3v-6a3 3 0 0 1 3 -3v-3a5 5 0 0 1 5 -5m0 12a2 2 0 0 0 -1.995 1.85l-.005 .15a2 2 0 1 0 2 -2m0 -10a3 3 0 0 0 -3 3v3h6v-3a3 3 0 0 0 -3 -3" />
  </g>
    <text font-weight="bold" fill="#1F2A37" font-size="21" x="120" y="240">VBAプロジェクトの
      </text><text font-weight="bold" fill="#1F2A37" font-size="21" x="120" y="268"><tspan>閲覧ロック</tspan>
    </text><text fill="#1F2A37" font-size="17" x="76" y="312">VBE でコードを見るときに
      </text><text fill="#1F2A37" font-size="17" x="76" y="338"><tspan>パスワードを求める保護。</tspan>
      </text><text fill="#1F2A37" font-size="17" x="76" y="364"><tspan>規格上、コード自体は暗号化</tspan>
      </text><text fill="#1F2A37" font-size="17" x="76" y="390"><tspan>されません。</tspan>
    </text><rect x="76" y="428" width="312" height="140" rx="12" fill="#FFFFFF" />
    <text x="96" y="456" font-size="16" font-weight="bold" fill="#24507F">扱い</text>
    <text fill="#1F2A37" font-size="16" x="96" y="484">読み書きとも影響しない見込み。
      </text><text fill="#1F2A37" font-size="16" x="96" y="508"><tspan>ロックの記録は温存され、従来の</tspan>
      </text><text fill="#1F2A37" font-size="16" x="96" y="532"><tspan>パスワードで解除できる見込み。</tspan>
      </text><text fill="#1F2A37" font-size="16" x="96" y="556"><tspan fill="#C05B21">実ファイル未検証（ベータ）。</tspan>
    </text></g>

  <g id="card-encrypt" data-pptx-bounds="456 190 368 400">
    <rect x="456" y="190" width="368" height="400" rx="16" fill="#F2F6FB" />
    
  <g transform="translate(484, 216) scale(1.25)" fill="#24507F">
    <path d="M11.998 2l.118 .007l.059 .008l.061 .013l.111 .034a.993 .993 0 0 1 .217 .112l.104 .082l.255 .218a11 11 0 0 0 7.189 2.537l.342 -.01a1 1 0 0 1 1.005 .717a13 13 0 0 1 -9.208 16.25a1 1 0 0 1 -.502 0a13 13 0 0 1 -9.209 -16.25a1 1 0 0 1 1.005 -.717a11 11 0 0 0 7.531 -2.527l.263 -.225l.096 -.075a.993 .993 0 0 1 .217 -.112l.112 -.034a.97 .97 0 0 1 .119 -.021l.115 -.007zm.002 7a2 2 0 0 0 -1.995 1.85l-.005 .15l.005 .15a2 2 0 0 0 .995 1.581v1.769l.007 .117a1 1 0 0 0 1.993 -.117l.001 -1.768a2 2 0 0 0 -1.001 -3.732z" />
  </g>
    <text font-weight="bold" fill="#1F2A37" font-size="21" x="528" y="240">ファイル全体の
      </text><text font-weight="bold" fill="#1F2A37" font-size="21" x="528" y="268"><tspan>暗号化</tspan>
    </text><text fill="#1F2A37" font-size="17" x="484" y="312">開くときにパスワードを求める
      </text><text fill="#1F2A37" font-size="17" x="484" y="338"><tspan>ブック。中身全体が暗号化され、</tspan>
      </text><text fill="#1F2A37" font-size="17" x="484" y="364"><tspan>マクロの区画に到達できません。</tspan>
    </text><rect x="484" y="428" width="312" height="140" rx="12" fill="#FFFFFF" />
    <text x="504" y="456" font-size="16" font-weight="bold" fill="#24507F">扱い</text>
    <text fill="#1F2A37" font-size="16" x="504" y="484">読み取れません（実測: モジュール
      </text><text fill="#1F2A37" font-size="16" x="504" y="508"><tspan>0 件になり先へ進めません）。</tspan>
      </text><text fill="#1F2A37" font-size="16" x="504" y="532"><tspan>パスワードを外した複製を作って</tspan>
      </text><text fill="#1F2A37" font-size="16" x="504" y="556"><tspan>から読み込んでください。</tspan>
    </text></g>

  <g id="card-sign" data-pptx-bounds="864 190 368 400">
    <rect x="864" y="190" width="368" height="400" rx="16" fill="#F2F6FB" />
    
  <g transform="translate(892, 216) scale(1.25)" fill="#24507F">
    <path d="M14.52 2c1.029 0 2.015 .409 2.742 1.136l3.602 3.602a3.877 3.877 0 0 1 0 5.483l-2.643 2.643a3.88 3.88 0 0 1 -4.941 .452l-.105 -.078l-5.882 5.883a3 3 0 0 1 -1.68 .843l-.22 .027l-.221 .009h-1.172c-1.014 0 -1.867 -.759 -1.991 -1.823l-.009 -.177v-1.172c0 -.704 .248 -1.386 .73 -1.96l.149 -.161l.414 -.414a1 1 0 0 1 .707 -.293h1v-1a1 1 0 0 1 .883 -.993l.117 -.007h1v-1a1 1 0 0 1 .206 -.608l.087 -.1l1.468 -1.469l-.076 -.103a3.9 3.9 0 0 1 -.678 -1.963l-.007 -.236c0 -1.029 .409 -2.015 1.136 -2.742l2.643 -2.643a3.88 3.88 0 0 1 2.741 -1.136m.495 5h-.02a2 2 0 1 0 0 4h.02a2 2 0 1 0 0 -4" />
  </g>
    <text x="936" y="240" font-size="21" font-weight="bold" fill="#1F2A37">VBA 署名</text>
    <text fill="#1F2A37" font-size="17" x="892" y="312">マクロの発行元を示す電子署名。
      </text><text fill="#1F2A37" font-size="17" x="892" y="338"><tspan>コードを書き換えると、どんな</tspan>
      </text><text fill="#1F2A37" font-size="17" x="892" y="364"><tspan>道具で直しても無効になります。</tspan>
    </text><rect x="892" y="428" width="312" height="140" rx="12" fill="#FFFFFF" />
    <text x="912" y="456" font-size="16" font-weight="bold" fill="#24507F">扱い</text>
    <text fill="#1F2A37" font-size="16" x="912" y="484">署名の区画には触れません。
      </text><text fill="#1F2A37" font-size="16" x="912" y="508"><tspan>改修後は署名が無効になるため、</tspan>
      </text><text fill="#1F2A37" font-size="16" x="912" y="532"><tspan>再署名は組織の手順で行って</tspan>
      </text><text fill="#1F2A37" font-size="16" x="912" y="556"><tspan>ください。<tspan fill="#C05B21">署名付き実ファイルは未検証。</tspan></tspan>
    </text></g>

  <g id="unlock-note" data-pptx-bounds="48 610 1184 36">
    
  <g transform="translate(48, 614) scale(0.916667)" fill="#C05B21">
    <path d="M12 1.67c.955 0 1.845 .467 2.39 1.247l.105 .16l8.114 13.548a2.914 2.914 0 0 1 -2.307 4.363l-.195 .008h-16.225a2.914 2.914 0 0 1 -2.582 -4.2l.099 -.185l8.11 -13.538a2.914 2.914 0 0 1 2.491 -1.403zm.01 13.33l-.127 .007a1 1 0 0 0 0 1.986l.117 .007l.127 -.007a1 1 0 0 0 0 -1.986l-.117 -.007zm-.01 -7a1 1 0 0 0 -.993 .883l-.007 .117v4l.007 .117a1 1 0 0 0 1.986 0l.007 -.117v-4l-.007 -.117a1 1 0 0 0 -.993 -.883z" />
  </g>
    <text x="82" y="632" font-size="17" fill="#5D6B7A">MacroStudio に、ロックやパスワードを解除・回避する機能はありません。</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="48 668 1184 32">
    <text x="48" y="692" font-size="14" fill="#5D6B7A">第5部　技術・運用付録</text>
    <text x="1232" y="692" font-size="14" fill="#5D6B7A" text-anchor="end">30</text>
  </g>
</svg>