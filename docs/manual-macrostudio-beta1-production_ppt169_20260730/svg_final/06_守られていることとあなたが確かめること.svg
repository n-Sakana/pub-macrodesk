<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <g id="header" data-pptx-bounds="48 44 1184 76">
    <rect x="48" y="44" width="76" height="28" rx="14" fill="#24507F" />
    <text x="86" y="63" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">第1部</text>
    <text x="48" y="106" font-size="40" font-weight="bold" fill="#24507F">守られていること・あなたが確かめること</text>
    <line x1="48" y1="120" x2="1232" y2="120" stroke="#E2E7EC" stroke-width="1.5" />
  </g>

  <g id="guarded" data-pptx-bounds="48 140 700 396">
    <rect x="48" y="140" width="700" height="396" rx="16" fill="#F2F6FB" />
    
  <g transform="translate(76, 164) scale(1.16667)" fill="#24507F">
    <path d="M11.998 2l.118 .007l.059 .008l.061 .013l.111 .034a.993 .993 0 0 1 .217 .112l.104 .082l.255 .218a11 11 0 0 0 7.189 2.537l.342 -.01a1 1 0 0 1 1.005 .717a13 13 0 0 1 -9.208 16.25a1 1 0 0 1 -.502 0a13 13 0 0 1 -9.209 -16.25a1 1 0 0 1 1.005 -.717a11 11 0 0 0 7.531 -2.527l.263 -.225l.096 -.075a.993 .993 0 0 1 .217 -.112l.112 -.034a.97 .97 0 0 1 .119 -.021l.115 -.007zm3.71 7.293a1 1 0 0 0 -1.415 0l-3.293 3.292l-1.293 -1.292l-.094 -.083a1 1 0 0 0 -1.32 1.497l2 2l.094 .083a1 1 0 0 0 1.32 -.083l4 -4l.083 -.094a1 1 0 0 0 -.083 -1.32z" />
  </g>
    <text x="116" y="186" font-size="24" font-weight="bold" fill="#1F2A37">アプリが守っていること</text>
    <text x="76" y="234" font-size="20" fill="#1F2A37">1　元のブックは上書きしない。結果は必ず別ファイル。</text>
    <text x="76" y="288" font-size="20" fill="#1F2A37">2　コードを AI へ自動送信しない。渡すのはあなた自身。</text>
    <text fill="#1F2A37" font-size="20" x="76" y="342">3　返答は依頼番号や区切りを機械的に確認してから
      </text><text fill="#1F2A37" font-size="20" x="104" y="372"><tspan>取り込む。合わなければ、何も取り込まない。</tspan>
    </text><text x="76" y="426" font-size="20" fill="#1F2A37">4　ビルド前に、元のブックが途中で変わっていないか確認。</text>
    <text fill="#1F2A37" font-size="20" x="76" y="480">5　書き戻したブックを読み直して検証。意図したコードが
      </text><text fill="#1F2A37" font-size="20" x="104" y="510"><tspan>入らなければ、出力そのものを残さない。</tspan>
    </text></g>

  <g id="not-guaranteed" data-pptx-bounds="780 140 452 396">
    <rect x="780" y="140" width="452" height="396" rx="16" fill="#FFFFFF" stroke="#C05B21" stroke-width="2" />
    
  <g transform="translate(808, 164) scale(1.16667)" fill="#C05B21">
    <path d="M12 1.67c.955 0 1.845 .467 2.39 1.247l.105 .16l8.114 13.548a2.914 2.914 0 0 1 -2.307 4.363l-.195 .008h-16.225a2.914 2.914 0 0 1 -2.582 -4.2l.099 -.185l8.11 -13.538a2.914 2.914 0 0 1 2.491 -1.403zm.01 13.33l-.127 .007a1 1 0 0 0 0 1.986l.117 .007l.127 -.007a1 1 0 0 0 0 -1.986l-.117 -.007zm-.01 -7a1 1 0 0 0 -.993 .883l-.007 .117v4l.007 .117a1 1 0 0 0 1.986 0l.007 -.117v-4l-.007 -.117a1 1 0 0 0 -.993 -.883z" />
  </g>
    <text x="848" y="186" font-size="24" font-weight="bold" fill="#1F2A37">アプリが保証しないこと</text>
    <text fill="#1F2A37" font-size="20" x="808" y="234">AI の返答の中身が、業務として
      </text><text fill="#1F2A37" font-size="20" x="808" y="266"><tspan>正しいかどうかは、アプリには</tspan>
      </text><text fill="#1F2A37" font-size="20" x="808" y="298"><tspan>分かりません。</tspan>
    </text><line x1="808" y1="348" x2="1204" y2="348" stroke="#E2E7EC" stroke-width="1.5" />
    <text x="808" y="392" font-size="20" font-weight="bold" fill="#1F2A37">だから、あなたが確かめます。</text>
    <text fill="#1F2A37" font-size="19" x="808" y="432">・変更内容を画面の差分で見る
      </text><text fill="#1F2A37" font-size="19" x="808" y="462"><tspan>　（→ P18）</tspan>
      </text><text fill="#1F2A37" font-size="19" x="808" y="496"><tspan>・最後に Excel で動作を確認する</tspan>
      </text><text fill="#1F2A37" font-size="19" x="808" y="526"><tspan>　（→ P21）</tspan>
    </text></g>

  <g id="reassure" data-pptx-bounds="48 560 1184 84">
    <rect x="48" y="560" width="1184" height="84" rx="16" fill="#FFFFFF" stroke="#3A7A47" stroke-width="1.5" />
    
  <g transform="translate(76, 588) scale(1.16667)" fill="#3A7A47">
    <path d="M11.998 2l.118 .007l.059 .008l.061 .013l.111 .034a.993 .993 0 0 1 .217 .112l.104 .082l.255 .218a11 11 0 0 0 7.189 2.537l.342 -.01a1 1 0 0 1 1.005 .717a13 13 0 0 1 -9.208 16.25a1 1 0 0 1 -.502 0a13 13 0 0 1 -9.209 -16.25a1 1 0 0 1 1.005 -.717a11 11 0 0 0 7.531 -2.527l.263 -.225l.096 -.075a.993 .993 0 0 1 .217 -.112l.112 -.034a.97 .97 0 0 1 .119 -.021l.115 -.007zm3.71 7.293a1 1 0 0 0 -1.415 0l-3.293 3.292l-1.293 -1.292l-.094 -.083a1 1 0 0 0 -1.32 1.497l2 2l.094 .083a1 1 0 0 0 1.32 -.083l4 -4l.083 -.094a1 1 0 0 0 -.083 -1.32z" />
  </g>
    <text x="120" y="612" font-size="22" fill="#1F2A37">途中でやめても、失敗しても、元のブックは変わっていません。何度でもやり直せます。</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="48 668 1184 32">
