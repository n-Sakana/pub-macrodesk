    <text x="726" y="188" font-size="21" font-weight="bold" fill="#1F2A37">ひな形の追加・差し替え</text>
    <text fill="#1F2A37" font-size="18" x="688" y="228"><tspan font-family="Consolas,monospace" font-size="16">presets</tspan> フォルダに Markdown を置くだけ。1 ファイルが
      </text><text fill="#1F2A37" font-size="18" x="688" y="256"><tspan>1 つの目的になり、再起動は不要です。</tspan>
    </text><text fill="#5D6B7A" font-size="17" x="688" y="310">書式が足りないファイルは「読み込めないひな形」として
      </text><text fill="#5D6B7A" font-size="17" x="688" y="336"><tspan>理由つきで表示され、選べなくなります。依頼のひな形は</tspan>
      </text><text fill="#5D6B7A" font-size="17" x="688" y="362"><tspan>道具ではなく文書なので、業務に合わせて育てられます。</tspan>
    </text></g>

  <g id="tip-template" data-pptx-bounds="48 404 580 236">
    <rect x="48" y="404" width="580" height="236" rx="16" fill="#F2F6FB" />
    
  <g transform="translate(76, 428) scale(1.08333)" fill="#24507F">
    <path d="M12 2l.117 .007a1 1 0 0 1 .876 .876l.007 .117v4l.005 .15a2 2 0 0 0 1.838 1.844l.157 .006h4l.117 .007a1 1 0 0 1 .876 .876l.007 .117v9a3 3 0 0 1 -2.824 2.995l-.176 .005h-10a3 3 0 0 1 -2.995 -2.824l-.005 -.176v-14a3 3 0 0 1 2.824 -2.995l.176 -.005zm3 14h-6a1 1 0 0 0 0 2h6a1 1 0 0 0 0 -2m0 -4h-6a1 1 0 0 0 0 2h6a1 1 0 0 0 0 -2m-5 -4h-1a1 1 0 1 0 0 2h1a1 1 0 0 0 0 -2" />
    <path d="M19 7h-4l-.001 -4.001z" />
  </g>
    <text x="114" y="448" font-size="21" font-weight="bold" fill="#1F2A37">依頼文の枠と、長いコード</text>
    <text fill="#1F2A37" font-size="18" x="76" y="488">依頼文の組み立て枠は <tspan font-family="Consolas,monospace" font-size="16">templates\request-template.txt</tspan>
      </text><text fill="#1F2A37" font-size="18" x="76" y="516"><tspan>（UTF-8）で変更できます。生成のたびに読み直されます。</tspan>
    </text><text fill="#5D6B7A" font-size="17" x="76" y="570">コードが長く返答が途中で切れるときの［モジュール単位
      </text><text fill="#5D6B7A" font-size="17" x="76" y="596"><tspan>出力］は、ひな形が対応の節を持つときだけ現れます</tspan>
      </text><text fill="#5D6B7A" font-size="17" x="76" y="622"><tspan>（同梱の改修用 3 つは対応済み）。</tspan>
    </text></g>

