    <text x="114" y="188" font-size="21" font-weight="bold" fill="#1F2A37">配布</text>
    <text fill="#1F2A37" font-size="18" x="76" y="228">フォルダ一式をコピーし、使う人には
      </text><text fill="#1F2A37" font-size="18" x="76" y="256"><tspan>「<tspan font-family="Consolas,monospace" font-size="16">launch.vbs</tspan> をダブルクリック」とだけ案内します。</tspan>
    </text><text fill="#5D6B7A" font-size="17" x="76" y="310">ZIP で渡す場合、展開前にファイルのプロパティで
      </text><text fill="#5D6B7A" font-size="17" x="76" y="336"><tspan>［許可する］が必要なことがあります</tspan>
      </text><text fill="#5D6B7A" font-size="17" x="76" y="362"><tspan>（Mark of the Web の解除）。</tspan>
    </text></g>

  <g id="tip-presets" data-pptx-bounds="660 144 572 236">
    <rect x="660" y="144" width="572" height="236" rx="16" fill="#F2F6FB" />
    
