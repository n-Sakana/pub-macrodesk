    <text x="726" y="448" font-size="21" font-weight="bold" fill="#1F2A37">ログと問い合わせ</text>
    <text fill="#1F2A37" font-size="18" x="688" y="488">動作記録は <tspan font-family="Consolas,monospace" font-size="16">%LOCALAPPDATA%\MacroStudio\logs</tspan> に
      </text><text fill="#1F2A37" font-size="18" x="688" y="516"><tspan>残ります。起動に失敗した場合も理由が記録されます。</tspan>
    </text><text fill="#5D6B7A" font-size="17" x="688" y="570">貼り付けたコードの本文は記録されません。問い合わせを
      </text><text fill="#5D6B7A" font-size="17" x="688" y="596"><tspan>受けるときは、このログの添付を依頼してください。</tspan>
    </text></g>

