<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-bounds="48 44 1184 76">
    <rect x="48" y="44" width="76" height="28" rx="14" fill="#24507F"/>
    <text x="86" y="63" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">第2部</text>
    <rect x="132" y="44" width="92" height="28" rx="14" fill="#FFFFFF" stroke="#24507F" stroke-width="1.5"/>
    <text x="178" y="63" font-size="14" font-weight="bold" fill="#24507F" text-anchor="middle">手順 4</text>
    <text x="48" y="106" font-size="40" font-weight="bold" fill="#24507F">最後の確認は、あなたの目で</text>
    <line x1="48" y1="120" x2="1232" y2="120" stroke="#E2E7EC" stroke-width="1.5"/>
  </g>

  <g id="boundary" data-pptx-bounds="48 144 1184 88">
    <text x="48" y="176" font-size="24" fill="#1F2A37">ビルドの検証で確かめたのは、取り込んだコードがそのまま入り、それ以外を変えていないこと。</text>
    <text x="48" y="214" font-size="24" fill="#1F2A37">マクロの中身が業務として正しいかは、ここから先の確認で分かります。</text>
  </g>

  <g id="check-1" data-pptx-bounds="48 260 1184 76">
    <circle cx="84" cy="298" r="22" fill="#24507F"/>
    <text x="84" y="306" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="128" y="290" font-size="24" font-weight="bold" fill="#1F2A37">改修済みブックを Excel で開く</text>
    <text x="128" y="322" font-size="19" fill="#5D6B7A">開くのは -Modified- の付いた方です。元のブックではありません。</text>
  </g>

  <g id="check-2" data-pptx-bounds="48 348 1184 76">
    <circle cx="84" cy="386" r="22" fill="#24507F"/>
    <text x="84" y="394" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="128" y="378" font-size="24" font-weight="bold" fill="#1F2A37">いつも使うマクロを、いつもの手順で 1 回実行する</text>
    <text x="128" y="410" font-size="19" fill="#5D6B7A">サンプルなら、申請一覧シートで検証マクロを実行します。</text>
  </g>

  <g id="check-3" data-pptx-bounds="48 436 1184 76">
    <circle cx="84" cy="474" r="22" fill="#24507F"/>
    <text x="84" y="482" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="128" y="466" font-size="24" font-weight="bold" fill="#1F2A37">結果がいつもどおりかを確かめる</text>
    <text x="128" y="498" font-size="19" fill="#5D6B7A">出力・集計・保存されるもの。目で見て、いつもと同じであること。</text>
  </g>

  <g id="check-4" data-pptx-bounds="48 524 1184 76">
    <circle cx="84" cy="562" r="22" fill="#24507F"/>
    <text x="84" y="570" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="128" y="554" font-size="24" font-weight="bold" fill="#1F2A37">しばらくは、元のブックも残しておく</text>
    <text x="128" y="586" font-size="19" fill="#5D6B7A">問題があれば元のブックで業務を続け、P25 の戻り先からやり直せます。</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="48 668 1184 32">
    <text x="48" y="692" font-size="14" fill="#5D6B7A">第2部　最初の一件　｜　手順 4 ・ ブックを作る</text>
    <text x="1232" y="692" font-size="14" fill="#5D6B7A" text-anchor="end">21</text>
  </g>
