<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <g id="header" data-pptx-bounds="48 44 1184 76">
    <rect x="48" y="44" width="76" height="28" rx="14" fill="#24507F" />
    <text x="86" y="63" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">第5部</text>
    <text x="48" y="106" font-size="40" font-weight="bold" fill="#24507F">EDR / DLP 環境での導入</text>
    <line x1="48" y1="120" x2="1232" y2="120" stroke="#E2E7EC" stroke-width="1.5" />
  </g>

  <g id="lead" data-pptx-bounds="48 136 1184 36">
    <text x="48" y="162" font-size="22" fill="#1F2A37">検知製品（EDR / DLP）のある環境では、何が通り何が止まるかは環境ごとに違います。事前検証のうえ展開してください。</text>
  </g>

  <g id="confirmed" data-pptx-bounds="48 190 580 300">
    <rect x="48" y="190" width="580" height="300" rx="16" fill="#F2F6FB" />
    
  <g transform="translate(76, 214) scale(1.16667)" fill="#24507F">
    <path d="M11.884 2.007l.114 -.007l.118 .007l.059 .008l.061 .013l.111 .034a.993 .993 0 0 1 .217 .112l.104 .082l.255 .218a11 11 0 0 0 7.189 2.537l.342 -.01a1 1 0 0 1 1.005 .717a13 13 0 0 1 -9.208 16.25a1 1 0 0 1 -.502 0a13 13 0 0 1 -9.209 -16.25a1 1 0 0 1 1.005 -.717a11 11 0 0 0 7.531 -2.527l.263 -.225l.096 -.075a.993 .993 0 0 1 .217 -.112l.112 -.034a.97 .97 0 0 1 .119 -.021z" />
  </g>
    <text x="116" y="236" font-size="21" font-weight="bold" fill="#1F2A37">確認できていること</text>
    <text fill="#1F2A37" font-size="17" x="76" y="276">・検証サンプル一式を同梱しています
      </text><text fill="#1F2A37" font-size="17" x="76" y="302"><tspan>　（<tspan font-family="Consolas,monospace" font-size="15">samples\edr-dlp-validation</tspan>。手順書・記録つき）。</tspan>
    </text><text fill="#1F2A37" font-size="17" x="76" y="342">・実在の 1 業務環境では、通常マクロの読み取りや
      </text><text fill="#1F2A37" font-size="17" x="76" y="368"><tspan>　クリップボード操作は通りました。一方、Win32 API</tspan>
      </text><text fill="#1F2A37" font-size="17" x="76" y="394"><tspan>　宣言を含むファイルの読取・複製・書き込みと、</tspan>
      </text><text fill="#1F2A37" font-size="17" x="76" y="420"><tspan>　貼り付け内容の新規ブック保存は遮断されました。</tspan>
    </text><text fill="#1F2A37" font-size="17" x="76" y="454">・検知製品の制約がない開発機では、全 35 の段階別
      </text><text fill="#1F2A37" font-size="17" x="76" y="480"><tspan>　診断がすべて通過しています。</tspan>
    </text></g>

  <g id="pertest" data-pptx-bounds="660 190 572 300">
    <rect x="660" y="190" width="572" height="300" rx="16" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1" />
    
  <g transform="translate(688, 214) scale(1.16667)" fill="#24507F">
    <path d="M14.647 4.081a.724 .724 0 0 0 1.08 .448c2.439 -1.485 5.23 1.305 3.745 3.744a.724 .724 0 0 0 .447 1.08c2.775 .673 2.775 4.62 0 5.294a.724 .724 0 0 0 -.448 1.08c1.485 2.439 -1.305 5.23 -3.744 3.745a.724 .724 0 0 0 -1.08 .447c-.673 2.775 -4.62 2.775 -5.294 0a.724 .724 0 0 0 -1.08 -.448c-2.439 1.485 -5.23 -1.305 -3.745 -3.744a.724 .724 0 0 0 -.447 -1.08c-2.775 -.673 -2.775 -4.62 0 -5.294a.724 .724 0 0 0 .448 -1.08c-1.485 -2.439 1.305 -5.23 3.744 -3.745a.722 .722 0 0 0 1.08 -.447c.673 -2.775 4.62 -2.775 5.294 0zm-2.647 4.919a3 3 0 1 0 0 6a3 3 0 0 0 0 -6" />
  </g>
    <text x="728" y="236" font-size="21" font-weight="bold" fill="#1F2A37">環境ごとに試すこと</text>
    <circle cx="705" cy="282" r="14" fill="#24507F" />
    <text x="705" y="288" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text fill="#1F2A37" font-size="17" x="732" y="288">対象環境で、最初に開く用のランナーだけを開き、
      </text><text fill="#1F2A37" font-size="17" x="732" y="314"><tspan>診断を一件ずつ実行します（自動実行はありません）。</tspan>
    </text><circle cx="705" cy="356" r="14" fill="#24507F" />
    <text x="705" y="362" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text fill="#1F2A37" font-size="17" x="732" y="362">外部ログ（<tspan font-family="Consolas,monospace" font-size="15">diagnostic-progress.tsv</tspan>）の停止地点と、
      </text><text fill="#1F2A37" font-size="17" x="732" y="388"><tspan>管理コンソールの検知イベントを突き合わせます。</tspan>
    </text><circle cx="705" cy="430" r="14" fill="#24507F" />
    <text x="705" y="436" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text fill="#1F2A37" font-size="17" x="732" y="436">遮断される操作があれば、除外設定や運用の回避策を
      </text><text fill="#1F2A37" font-size="17" x="732" y="462"><tspan>検討してから展開します。</tspan>
    </text></g>

  <g id="boundary" data-pptx-bounds="48 514 1184 120">
    <rect x="48" y="514" width="1184" height="120" rx="16" fill="#FFFFFF" stroke="#C05B21" stroke-width="1.5" />
    
  <g transform="translate(76, 538) scale(1.08333)" fill="#C05B21">
    <path d="M12 1.67c.955 0 1.845 .467 2.39 1.247l.105 .16l8.114 13.548a2.914 2.914 0 0 1 -2.307 4.363l-.195 .008h-16.225a2.914 2.914 0 0 1 -2.582 -4.2l.099 -.185l8.11 -13.538a2.914 2.914 0 0 1 2.491 -1.403zm.01 13.33l-.127 .007a1 1 0 0 0 0 1.986l.117 .007l.127 -.007a1 1 0 0 0 0 -1.986l-.117 -.007zm-.01 -7a1 1 0 0 0 -.993 .883l-.007 .117v4l.007 .117a1 1 0 0 0 1.986 0l.007 -.117v-4l-.007 -.117a1 1 0 0 0 -.993 -.883z" />
  </g>
    <text x="114" y="558" font-size="19" font-weight="bold" fill="#1F2A37">境界</text>
    <text x="76" y="590" font-size="18" fill="#1F2A37">制約のない環境で通ったことは、本番の EDR / DLP を通ることを意味しません。検証サンプルは検知・遮断の地点を</text>
    <text x="76" y="618" font-size="18" fill="#1F2A37">観測するための道具であり、検知の回避を目的としたものではありません。</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="48 668 1184 32">
    <text x="48" y="692" font-size="14" fill="#5D6B7A">第5部　技術・運用付録</text>
    <text x="1232" y="692" font-size="14" fill="#5D6B7A" text-anchor="end">32</text>
  </g>
</svg>