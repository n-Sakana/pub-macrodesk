<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <defs>
    <clipPath id="shotClip13">
      <rect x="56" y="158" width="704" height="396" rx="10" ry="10"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-bounds="48 44 1184 76">
    <rect x="48" y="44" width="76" height="28" rx="14" fill="#24507F"/>
    <text x="86" y="63" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">第2部</text>
    <rect x="132" y="44" width="92" height="28" rx="14" fill="#FFFFFF" stroke="#24507F" stroke-width="1.5"/>
    <text x="178" y="63" font-size="14" font-weight="bold" fill="#24507F" text-anchor="middle">手順 2</text>
    <text x="48" y="106" font-size="40" font-weight="bold" fill="#24507F">目的を選んでください</text>
    <line x1="48" y1="120" x2="1232" y2="120" stroke="#E2E7EC" stroke-width="1.5"/>
  </g>

  <g id="screenshot" data-pptx-bounds="48 150 720 452">
    <rect x="48" y="150" width="720" height="412" rx="14" fill="#F2F6FB"/>
    <image href="../images/08-purpose-selected.png" x="56" y="158" width="704" height="396" preserveAspectRatio="xMidYMid meet" clip-path="url(#shotClip13)"/>
    <rect x="56" y="158" width="704" height="396" rx="10" fill="none" stroke="#E2E7EC" stroke-width="1.5"/>
    <text x="56" y="588" font-size="16" fill="#5D6B7A">今回は「Win32 API を使わない形へ直す」を選択。名前の下の一行が、それぞれの説明です。</text>
  </g>

  <g id="purpose-list" data-pptx-bounds="800 150 432 300">
    <text x="800" y="174" font-size="18" font-weight="bold" fill="#1F2A37">改修の目的は 3 つから選べます。</text>
    <rect x="800" y="192" width="432" height="76" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <text x="820" y="222" font-size="18" font-weight="bold" fill="#1F2A37">VBAリファクター</text>
    <text x="820" y="250" font-size="16" fill="#5D6B7A">今の動きを変えないまま、読みやすく直す。</text>
    <rect x="800" y="280" width="432" height="76" rx="12" fill="#FFFFFF" stroke="#C05B21" stroke-width="2"/>
    <text x="820" y="310" font-size="18" font-weight="bold" fill="#1F2A37">Win32 API を使わない形へ直す　← 今回</text>
    <text x="820" y="338" font-size="16" fill="#5D6B7A">新しい端末でも動く書き方へ置き換える。</text>
    <rect x="800" y="368" width="432" height="76" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <text x="820" y="398" font-size="18" font-weight="bold" fill="#1F2A37">自分で改修内容を書く</text>
    <text x="820" y="426" font-size="16" fill="#5D6B7A">どう直してほしいかを、自分の言葉で書く。</text>
  </g>

  <g id="steps" data-pptx-bounds="800 470 432 130">
    <circle cx="817" cy="490" r="15" fill="#24507F"/>
    <text x="817" y="496" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="846" y="498" font-size="20" fill="#1F2A37">近いものをひとつ押して、［次へ］。</text>
    <circle cx="817" cy="534" r="15" fill="#24507F"/>
    <text x="817" y="540" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="846" y="542" font-size="19" fill="#1F2A37">迷ったら「自分で改修内容を書く」を
      <tspan x="846" dy="28">選び、次の画面で内容を書きます。</tspan>
    </text>
  </g>

  <g id="question-note" data-pptx-bounds="48 616 1184 40">
    <text x="48" y="640" font-size="17" fill="#5D6B7A">ひな形によっては、先にいくつか質問が出ます（相談の例 → P23）。答えた内容は依頼文に折り込まれます。</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="48 668 1184 32">
    <text x="48" y="692" font-size="14" fill="#5D6B7A">第2部　最初の一件　｜　手順 2 ・ AIへ依頼する</text>
    <text x="1232" y="692" font-size="14" fill="#5D6B7A" text-anchor="end">13</text>
  </g>
</svg>
