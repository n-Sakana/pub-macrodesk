<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <defs>
    <clipPath id="shotClip16a">
      <rect x="56" y="158" width="560" height="315" rx="10" ry="10"/>
    </clipPath>
    <clipPath id="shotClip16b">
      <rect x="664" y="158" width="560" height="315" rx="10" ry="10"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-bounds="48 44 1184 76">
    <rect x="48" y="44" width="76" height="28" rx="14" fill="#24507F"/>
    <text x="86" y="63" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">第2部</text>
    <rect x="132" y="44" width="92" height="28" rx="14" fill="#FFFFFF" stroke="#24507F" stroke-width="1.5"/>
    <text x="178" y="63" font-size="14" font-weight="bold" fill="#24507F" text-anchor="middle">手順 3</text>
    <text x="48" y="106" font-size="40" font-weight="bold" fill="#24507F">AIの返答をまとめて取り込みます</text>
    <line x1="48" y1="120" x2="1232" y2="120" stroke="#E2E7EC" stroke-width="1.5"/>
  </g>

  <g id="shot-before" data-pptx-bounds="48 150 576 372">
    <rect x="48" y="150" width="576" height="331" rx="14" fill="#F2F6FB"/>
    <image href="../images/13-intake.png" x="56" y="158" width="560" height="315" preserveAspectRatio="xMidYMid meet" clip-path="url(#shotClip16a)"/>
    <rect x="56" y="158" width="560" height="315" rx="10" fill="none" stroke="#E2E7EC" stroke-width="1.5"/>
    <text x="56" y="507" font-size="16" fill="#5D6B7A">取り込む前。ボタンは 1 つだけです。モジュールを選ぶ操作はありません。</text>
  </g>

  <g id="shot-after" data-pptx-bounds="656 150 576 372">
    <rect x="656" y="150" width="576" height="331" rx="14" fill="#F2F6FB"/>
    <image href="../images/14-intake-done.png" x="664" y="158" width="560" height="315" preserveAspectRatio="xMidYMid meet" clip-path="url(#shotClip16b)"/>
    <rect x="664" y="158" width="560" height="315" rx="10" fill="none" stroke="#E2E7EC" stroke-width="1.5"/>
    <text x="664" y="507" font-size="16" fill="#5D6B7A">成功すると「5個のモジュールを取り込みました」。既存 4 個・新規 1 個。</text>
  </g>

  <g id="steps" data-pptx-bounds="48 528 700 110">
    <circle cx="65" cy="548" r="15" fill="#24507F"/>
    <text x="65" y="554" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="94" y="556" font-size="20" fill="#1F2A37">AI の返答にあるコードブロックを、先頭から末尾まで全文コピーします。</text>
    <circle cx="65" cy="588" r="15" fill="#24507F"/>
    <text x="65" y="594" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="94" y="596" font-size="20" fill="#1F2A37">［クリップボードからAIの返答を取り込む］を押します（Ctrl+V でも同じ）。</text>
    <circle cx="65" cy="628" r="15" fill="#24507F"/>
    <text x="65" y="634" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="94" y="636" font-size="20" fill="#1F2A37">件数が出たら成功です。［次へ］で確認へ進みます。</text>
  </g>

  <g id="fail-note" data-pptx-bounds="772 528 460 112">
    <rect x="772" y="528" width="460" height="112" rx="14" fill="#FFFFFF" stroke="#C05B21" stroke-width="1.5"/>
    <use data-icon="tabler-filled/alert-triangle" x="792" y="548" width="24" height="24" fill="#C05B21"/>
    <text x="828" y="566" font-size="17" fill="#1F2A37">取り込めないときは、次にすることが 1 文で
      <tspan x="792" dy="28">出ます。コードブロック全体をもう一度コピーして</tspan>
      <tspan x="792" dy="28">押し直してください。状態は壊れていません。</tspan>
    </text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="48 668 1184 32">
    <text x="48" y="692" font-size="14" fill="#5D6B7A">第2部　最初の一件　｜　手順 3 ・ 返答を取り込む</text>
    <text x="1232" y="692" font-size="14" fill="#5D6B7A" text-anchor="end">16</text>
  </g>
</svg>
