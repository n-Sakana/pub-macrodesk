<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-bounds="48 44 1184 76">
    <rect x="48" y="44" width="76" height="28" rx="14" fill="#24507F"/>
    <text x="86" y="63" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">第5部</text>
    <text x="48" y="106" font-size="40" font-weight="bold" fill="#24507F">Excelを開かずにVBAを読む仕組み</text>
    <line x1="48" y1="120" x2="1232" y2="120" stroke="#E2E7EC" stroke-width="1.5"/>
  </g>

  <g id="lead" data-pptx-bounds="48 136 1184 36">
    <text x="48" y="162" font-size="22" fill="#1F2A37">マクロは、ブックの中の 1 つのファイルに、公開された規格どおりに収まっています。MacroStudio はそれを直接読みます。</text>
  </g>

  <g id="nesting-diagram" data-pptx-bounds="48 190 760 380">
    <rect x="48" y="190" width="760" height="380" rx="16" fill="#F2F6FB"/>
    <text x="76" y="226" font-size="18" font-weight="bold" fill="#1F2A37">申請データ検証.xlsm　<tspan fill="#5D6B7A" font-weight="normal" font-size="16">＝ ZIP 形式の入れ物</tspan></text>
    <rect x="76" y="242" width="704" height="304" rx="12" fill="#FFFFFF" stroke="#CFD7DE" stroke-width="1.5"/>
    <text x="100" y="276" font-size="17" fill="#5D6B7A">シートや書式のデータ …（触れません）</text>
    <text x="100" y="312" font-size="18" font-weight="bold" fill="#1F2A37"><tspan font-family="Consolas,monospace">xl/vbaProject.bin</tspan>　<tspan fill="#5D6B7A" font-weight="normal" font-size="16">＝ マクロ全体が入る 1 ファイル</tspan></text>
    <rect x="100" y="326" width="656" height="200" rx="10" fill="#F2F6FB" stroke="#2B5C96" stroke-width="1.5"/>
    <text x="124" y="358" font-size="17" font-weight="bold" fill="#1F2A37">OLE2（複合ドキュメント）　<tspan fill="#5D6B7A" font-weight="normal" font-size="15">＝ 区画に分かれた構造［MS-CFB］</tspan></text>
    <rect x="124" y="372" width="608" height="64" rx="8" fill="#FFFFFF" stroke="#CFD7DE" stroke-width="1"/>
    <text x="144" y="398" font-size="16" fill="#1F2A37">管理情報の区画　<tspan font-family="Consolas,monospace" font-size="15">dir ・ PROJECT ・ PROJECTwm</tspan></text>
    <text x="144" y="424" font-size="15" fill="#5D6B7A">モジュールの一覧・種類・置き場所の台帳</text>
    <rect x="124" y="446" width="608" height="64" rx="8" fill="#FFFFFF" stroke="#CFD7DE" stroke-width="1"/>
    <text x="144" y="472" font-size="16" fill="#1F2A37">モジュールの区画　<tspan font-family="Consolas,monospace" font-size="15">AppController ・ TimerUtils …</tspan></text>
    <text x="144" y="498" font-size="15" fill="#5D6B7A">コード本文（MS-OVBA 規格の圧縮）→ 展開すると VBA ソース</text>
  </g>

  <g id="explain" data-pptx-bounds="840 190 392 380">
    <circle cx="857" cy="212" r="15" fill="#24507F"/>
    <text x="857" y="218" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="886" y="220" font-size="19" fill="#1F2A37">MacroStudio はこの経路を自前の
      <tspan x="886" dy="28">実装でたどり、Excel を起動せずに</tspan>
      <tspan x="886" dy="28">コードを取り出します。</tspan>
    </text>
    <circle cx="857" cy="316" r="15" fill="#24507F"/>
    <text x="857" y="322" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="886" y="324" font-size="19" fill="#1F2A37">書き戻しも同じ経路の逆向きで、
      <tspan x="886" dy="28"><tspan font-family="Consolas,monospace" font-size="17">vbaProject.bin</tspan> だけを組み直します。</tspan>
      <tspan x="886" dy="28">シートの値・書式・数式には</tspan>
      <tspan x="886" dy="28">触れません。</tspan>
    </text>
    <circle cx="857" cy="460" r="15" fill="#24507F"/>
    <text x="857" y="466" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="886" y="468" font-size="19" fill="#1F2A37">壊れかけたブックも複数の経路で
      <tspan x="886" dy="28">読み直し、読めたモジュールは</tspan>
      <tspan x="886" dy="28">必ず保持します（案内 → P12）。</tspan>
    </text>
  </g>

  <g id="dependency-note" data-pptx-bounds="48 592 1184 48">
    <text x="48" y="620" font-size="17" fill="#5D6B7A">実装は本体同梱（外部ライブラリへの実行時依存なし）。MS-CFB / MS-OVBA は Microsoft が公開している文書化された仕様です。</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="48 668 1184 32">
    <text x="48" y="692" font-size="14" fill="#5D6B7A">第5部　技術・運用付録</text>
    <text x="1232" y="692" font-size="14" fill="#5D6B7A" text-anchor="end">27</text>
  </g>
</svg>
