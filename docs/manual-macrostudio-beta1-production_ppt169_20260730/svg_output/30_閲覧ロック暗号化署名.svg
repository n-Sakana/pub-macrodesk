<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-bounds="48 44 1184 76">
    <rect x="48" y="44" width="76" height="28" rx="14" fill="#24507F"/>
    <text x="86" y="63" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">第5部</text>
    <text x="48" y="106" font-size="40" font-weight="bold" fill="#24507F">閲覧ロック・暗号化・署名</text>
    <line x1="48" y1="120" x2="1232" y2="120" stroke="#E2E7EC" stroke-width="1.5"/>
  </g>

  <g id="lead" data-pptx-bounds="48 136 1184 36">
    <text x="48" y="162" font-size="22" fill="#1F2A37">似ていて紛らわしい 3 つの保護は、扱いがそれぞれ違います。</text>
  </g>

  <g id="card-lock" data-pptx-bounds="48 190 368 400">
    <rect x="48" y="190" width="368" height="400" rx="16" fill="#F2F6FB"/>
    <use data-icon="tabler-filled/lock" x="76" y="216" width="30" height="30" fill="#24507F"/>
    <text x="120" y="240" font-size="21" font-weight="bold" fill="#1F2A37">VBAプロジェクトの
      <tspan x="120" dy="28">閲覧ロック</tspan>
    </text>
    <text x="76" y="312" font-size="17" fill="#1F2A37">VBE でコードを見るときに
      <tspan x="76" dy="26">パスワードを求める保護。</tspan>
      <tspan x="76" dy="26">規格上、コード自体は暗号化</tspan>
      <tspan x="76" dy="26">されません。</tspan>
    </text>
    <rect x="76" y="428" width="312" height="140" rx="12" fill="#FFFFFF"/>
    <text x="96" y="456" font-size="16" font-weight="bold" fill="#24507F">扱い</text>
    <text x="96" y="484" font-size="16" fill="#1F2A37">読み書きとも影響しない見込み。
      <tspan x="96" dy="24">ロックの記録は温存され、従来の</tspan>
      <tspan x="96" dy="24">パスワードで解除できる見込み。</tspan>
      <tspan x="96" dy="24" fill="#C05B21">実ファイル未検証（ベータ）。</tspan>
    </text>
  </g>

  <g id="card-encrypt" data-pptx-bounds="456 190 368 400">
    <rect x="456" y="190" width="368" height="400" rx="16" fill="#F2F6FB"/>
    <use data-icon="tabler-filled/shield-lock" x="484" y="216" width="30" height="30" fill="#24507F"/>
    <text x="528" y="240" font-size="21" font-weight="bold" fill="#1F2A37">ファイル全体の
      <tspan x="528" dy="28">暗号化</tspan>
    </text>
    <text x="484" y="312" font-size="17" fill="#1F2A37">開くときにパスワードを求める
      <tspan x="484" dy="26">ブック。中身全体が暗号化され、</tspan>
      <tspan x="484" dy="26">マクロの区画に到達できません。</tspan>
    </text>
    <rect x="484" y="428" width="312" height="140" rx="12" fill="#FFFFFF"/>
    <text x="504" y="456" font-size="16" font-weight="bold" fill="#24507F">扱い</text>
    <text x="504" y="484" font-size="16" fill="#1F2A37">読み取れません（実測: モジュール
      <tspan x="504" dy="24">0 件になり先へ進めません）。</tspan>
      <tspan x="504" dy="24">パスワードを外した複製を作って</tspan>
      <tspan x="504" dy="24">から読み込んでください。</tspan>
    </text>
  </g>

  <g id="card-sign" data-pptx-bounds="864 190 368 400">
    <rect x="864" y="190" width="368" height="400" rx="16" fill="#F2F6FB"/>
    <use data-icon="tabler-filled/key" x="892" y="216" width="30" height="30" fill="#24507F"/>
    <text x="936" y="240" font-size="21" font-weight="bold" fill="#1F2A37">VBA 署名</text>
    <text x="892" y="312" font-size="17" fill="#1F2A37">マクロの発行元を示す電子署名。
      <tspan x="892" dy="26">コードを書き換えると、どんな</tspan>
      <tspan x="892" dy="26">道具で直しても無効になります。</tspan>
    </text>
    <rect x="892" y="428" width="312" height="140" rx="12" fill="#FFFFFF"/>
    <text x="912" y="456" font-size="16" font-weight="bold" fill="#24507F">扱い</text>
    <text x="912" y="484" font-size="16" fill="#1F2A37">署名の区画には触れません。
      <tspan x="912" dy="24">改修後は署名が無効になるため、</tspan>
      <tspan x="912" dy="24">再署名は組織の手順で行って</tspan>
      <tspan x="912" dy="24">ください。<tspan fill="#C05B21">署名付き実ファイルは未検証。</tspan></tspan>
    </text>
  </g>

  <g id="unlock-note" data-pptx-bounds="48 610 1184 36">
    <use data-icon="tabler-filled/alert-triangle" x="48" y="614" width="22" height="22" fill="#C05B21"/>
    <text x="82" y="632" font-size="17" fill="#5D6B7A">MacroStudio に、ロックやパスワードを解除・回避する機能はありません。</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="48 668 1184 32">
    <text x="48" y="692" font-size="14" fill="#5D6B7A">第5部　技術・運用付録</text>
    <text x="1232" y="692" font-size="14" fill="#5D6B7A" text-anchor="end">30</text>
  </g>
</svg>
