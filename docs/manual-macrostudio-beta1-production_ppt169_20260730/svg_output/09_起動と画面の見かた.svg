    <text x="984" y="376" font-size="18" font-weight="bold" fill="#C05B21">3</text>
    <text x="1008" y="376" font-size="18" font-weight="bold" fill="#1F2A37">作業領域</text>
    <text x="1008" y="402" font-size="17" fill="#5D6B7A">選ぶ・入れるのは
