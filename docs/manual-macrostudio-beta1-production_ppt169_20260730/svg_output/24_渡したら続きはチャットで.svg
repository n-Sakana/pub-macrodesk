<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <defs>
    <clipPath id="shotClip24a">
      <rect x="56" y="158" width="560" height="315" rx="10" ry="10"/>
    </clipPath>
    <clipPath id="shotClip24b">
      <rect x="664" y="158" width="560" height="315" rx="10" ry="10"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-bounds="48 44 1184 76">
    <rect x="48" y="44" width="76" height="28" rx="14" fill="#2B5C96"/>
    <text x="86" y="63" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">第3部</text>
    <text x="48" y="106" font-size="40" font-weight="bold" fill="#24507F">渡したら、続きはチャットで</text>
    <line x1="48" y1="120" x2="1232" y2="120" stroke="#E2E7EC" stroke-width="1.5"/>
  </g>

  <g id="shot-request" data-pptx-bounds="48 150 576 372">
    <rect x="48" y="150" width="576" height="331" rx="14" fill="#F2F6FB"/>
    <image href="../images/35-request-diagnose-open.png" x="56" y="158" width="560" height="315" preserveAspectRatio="xMidYMid meet" clip-path="url(#shotClip24a)"/>
    <rect x="56" y="158" width="560" height="315" rx="10" fill="none" stroke="#E2E7EC" stroke-width="1.5"/>
    <text x="56" y="507" font-size="16" fill="#5D6B7A">依頼文には、答えた内容が【質問への回答】として折り込まれています。</text>
  </g>

  <g id="shot-done" data-pptx-bounds="656 150 576 372">
    <rect x="656" y="150" width="576" height="331" rx="14" fill="#F2F6FB"/>
    <image href="../images/37-handoff-diagnose-done.png" x="664" y="158" width="560" height="315" preserveAspectRatio="xMidYMid meet" clip-path="url(#shotClip24b)"/>
    <rect x="664" y="158" width="560" height="315" rx="10" fill="none" stroke="#E2E7EC" stroke-width="1.5"/>
    <text x="664" y="507" font-size="16" fill="#5D6B7A">「AIチャットへ質問します」。両方済むと右下が［完了］になります。</text>
  </g>

  <g id="steps" data-pptx-bounds="48 532 700 100">
    <circle cx="65" cy="552" r="15" fill="#24507F"/>
    <text x="65" y="558" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="94" y="560" font-size="20" fill="#1F2A37">改修のときと同じように、依頼文をコピーして貼り、
      <tspan x="94" dy="30"><tspan font-family="Consolas,monospace">source-code.md</tspan> を添付して送ります。</tspan>
    </text>
    <circle cx="65" cy="622" r="15" fill="#24507F"/>
    <text x="65" y="628" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="94" y="630" font-size="20" fill="#1F2A37">［完了］を押すと最初の画面へ戻ります。返答はチャットで読みます。</text>
  </g>

  <g id="continue-note" data-pptx-bounds="772 528 460 120">
    <rect x="772" y="528" width="460" height="120" rx="14" fill="#F2F6FB"/>
    <use data-icon="tabler-filled/message-chatbot" x="792" y="546" width="26" height="26" fill="#2B5C96"/>
    <text x="830" y="566" font-size="17" fill="#1F2A37">AI は質問しながら進め方を一緒に絞り、最後に
      <tspan x="792" dy="26">改修方針をまとめてくれます。その方針は、</tspan>
      <tspan x="792" dy="26">「AIで改修する」の「自分で改修内容を書く」に</tspan>
      <tspan x="792" dy="26">そのまま使えます。</tspan>
    </text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="48 668 1184 32">
    <text x="48" y="692" font-size="14" fill="#5D6B7A">第3部　相談する使い方</text>
    <text x="1232" y="692" font-size="14" fill="#5D6B7A" text-anchor="end">24</text>
  </g>
</svg>
