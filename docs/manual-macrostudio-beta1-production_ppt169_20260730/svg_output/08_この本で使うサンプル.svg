      <text x="92" y="444" font-size="18" fill="#1F2A37" font-family="Consolas,monospace">TimerUtils</text>
      <text x="330" y="444" font-size="18" fill="#1F2A37" text-anchor="end">14</text>
      <text x="356" y="444" font-size="18" fill="#1F2A37">待ち時間と経過時間</text>
