  </g>

  <g id="trouble" data-pptx-bounds="720 140 512 200">
    <rect x="720" y="140" width="512" height="200" rx="16" fill="#FFFFFF" stroke="#C05B21" stroke-width="2"/>
    <use data-icon="tabler-filled/alert-triangle" x="748" y="164" width="28" height="28" fill="#C05B21"/>
    <text x="788" y="186" font-size="22" font-weight="bold" fill="#1F2A37">困りごと</text>
    <text x="748" y="228" font-size="19" fill="#1F2A37">新しい業務端末では、Win32 API という古い
      <tspan x="748" dy="30">仕組みが使えません。このマクロは待ち時間を</tspan>
      <tspan x="748" dy="30">作るために、それ（Sleep）を 19 か所で</tspan>
      <tspan x="748" dy="30">使っています。</tspan>
    </text>
  </g>

  <g id="plan" data-pptx-bounds="720 364 512 200">
    <rect x="720" y="364" width="512" height="200" rx="16" fill="#F2F6FB"/>
    <use data-icon="tabler-filled/circle-check" x="748" y="388" width="28" height="28" fill="#24507F"/>
    <text x="788" y="410" font-size="22" font-weight="bold" fill="#1F2A37">今回やること</text>
    <text x="748" y="452" font-size="19" fill="#1F2A37">目的「Win32 API を使わない形へ直す」で
      <tspan x="748" dy="30">AI に依頼し、改修済みブックを作って、</tspan>
      <tspan x="748" dy="30">Excel で動作を確かめるところまで通します。</tspan>
    </text>
  </g>

  <g id="sample-note" data-pptx-bounds="48 592 1184 44">
    <text x="48" y="620" font-size="17" fill="#5D6B7A">この先の画面写真は、すべてこのサンプルの実操作です。ブック名やフォルダは架空の例で、実在の業務データは含みません。</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="48 668 1184 32">
    <text x="48" y="692" font-size="14" fill="#5D6B7A">第2部　最初の一件</text>
    <text x="1232" y="692" font-size="14" fill="#5D6B7A" text-anchor="end">08</text>
