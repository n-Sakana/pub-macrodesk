    <text x="120" y="190" font-size="24" font-weight="bold" fill="#1F2A37">申請データ検証.xlsm</text>
    <text x="76" y="234" font-size="19" fill="#1F2A37">申請一覧シートの内容を検証し、結果とログを書き込む
      <tspan x="76" dy="30">部門マクロ。8 モジュール・484 行。</tspan>
    </text>
    <g id="module-table" data-pptx-replace-with="table">
      <metadata type="application/json">
        {
          "x": 76, "y": 300, "width": 584, "height": 236,
          "name": "p08-module-table",
          "columns": ["モジュール", "行数", "はたらき"],
          "rows": [
            ["AppController", {"text": "103", "align": "r"}, "検証全体の入口と進行"],
            ["SystemInfo", {"text": "157", "align": "r"}, "シート構成の確認と設定の読み取り"],
            ["TimerUtils", {"text": "14", "align": "r"}, "待ち時間と経過時間"],
            ["WindowUtils", {"text": "210", "align": "r"}, "申請 1 行ずつの検証と結果の書き込み"],
