      <text x="330" y="522" font-size="18" fill="#5D6B7A" text-anchor="end">0</text>
      <text x="356" y="522" font-size="18" fill="#5D6B7A">シート側のモジュール（コードなし）</text>
      <rect x="76" y="300" width="584" height="236" rx="8" fill="none" stroke="#E2E7EC" stroke-width="1.5"/>
