<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#4A87C4"/>
    </marker>
    <marker id="branchArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#E07B39"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="40 44 1200 78">
    <rect x="40" y="50" width="132" height="36" rx="18" fill="#1F4E79"/>
    <text x="106" y="75" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">全体の流れ</text>
    <text x="190" y="86" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F2933">まず、どちらかを選びます</text>
    <text x="1240" y="84" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F4E79">ブックを書き換えるのは「改修する」だけ</text>
    <line x1="40" y1="118" x2="1240" y2="118" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <g id="mode-refactor" data-pptx-bounds="40 146 588 172">
    <rect x="40" y="146" width="588" height="172" rx="16" fill="#F4F6F8"/>
    <rect x="40" y="146" width="588" height="7" rx="3.5" fill="#1F4E79"/>
    <use data-icon="tabler-filled/settings" x="76" y="182" width="32" height="32" fill="#1F4E79"/>
    <text x="122" y="209" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="30" font-weight="bold" fill="#1F2933">マクロを改修する</text>
    <text x="76" y="256" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#5B6B7C">AI の返答を取り込み、改修済みブックを作る</text>
    <rect x="76" y="272" width="230" height="32" rx="16" fill="#1F4E79"/>
    <text x="191" y="294" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">5 ファイルができる</text>
  </g>

  <g id="mode-ask" data-pptx-bounds="652 146 588 172">
    <rect x="652" y="146" width="588" height="172" rx="16" fill="#F4F6F8"/>
    <rect x="652" y="146" width="588" height="7" rx="3.5" fill="#4A87C4"/>
    <use data-icon="tabler-filled/message-chatbot" x="688" y="182" width="32" height="32" fill="#4A87C4"/>
    <text x="734" y="209" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="30" font-weight="bold" fill="#1F2933">マクロについて AI に聞く</text>
    <text x="688" y="256" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#5B6B7C">依頼文とコード全文を作る。ブックは変更しない</text>
    <rect x="688" y="272" width="230" height="32" rx="16" fill="#4A87C4"/>
    <text x="803" y="294" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">2 ファイルができる</text>
  </g>

  <g id="flow-steps" data-pptx-bounds="40 380 1200 112">
    <line x1="308" y1="436" x2="336" y2="436" stroke="#4A87C4" stroke-width="3" marker-end="url(#flowArrow)"/>
    <line x1="608" y1="436" x2="636" y2="436" stroke="#4A87C4" stroke-width="3" marker-end="url(#flowArrow)"/>
    <line x1="908" y1="436" x2="936" y2="436" stroke="#4A87C4" stroke-width="3" marker-end="url(#flowArrow)"/>

    <rect x="40" y="380" width="268" height="112" rx="16" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
    <circle cx="76" cy="416" r="20" fill="#1F4E79"/>
    <text x="76" y="424" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="174" y="472" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2933">ブックを読み込む</text>

    <rect x="340" y="380" width="268" height="112" rx="16" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
    <circle cx="376" cy="416" r="20" fill="#1F4E79"/>
    <text x="376" y="424" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="474" y="472" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2933">AI へ依頼する</text>

    <rect x="640" y="380" width="268" height="112" rx="16" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
    <circle cx="676" cy="416" r="20" fill="#1F4E79"/>
    <text x="676" y="424" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="774" y="472" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2933">返答を取り込む</text>

    <rect x="940" y="380" width="268" height="112" rx="16" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
    <circle cx="976" cy="416" r="20" fill="#1F4E79"/>
    <text x="976" y="424" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">4</text>
    <text x="1074" y="472" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2933">ブックを作る</text>
  </g>

  <g id="flow-branch" data-pptx-bounds="340 492 620 128">
    <line x1="474" y1="492" x2="474" y2="552" stroke="#E07B39" stroke-width="3" marker-end="url(#branchArrow)"/>
    <rect x="340" y="560" width="620" height="60" rx="14" fill="#FFFFFF" stroke="#E07B39" stroke-width="2"/>
    <use data-icon="tabler-filled/circle-check" x="368" y="576" width="28" height="28" fill="#E07B39"/>
    <text x="412" y="598" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2933">聞くだけの場合は、手順 2 で［完了］が出ます。</text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="40 664 1200 26">
    <text x="40" y="682" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">第二部 操作マニュアル</text>
    <text x="1240" y="682" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">09</text>
  </g>
</svg>
