<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#4A87C4"/>
    </marker>
    <marker id="branchArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#E07B39"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-bounds="100 44 1080 100">
    <text x="100" y="84" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F4E79">まず、どちらかを選びます</text>
    <text x="100" y="128" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="30" fill="#5B6B7C">ブックを書き換えるのは「改修する」だけ。聞くだけなら手順 2 で終わる</text>
  </g>

  <g id="mode-refactor" data-pptx-bounds="100 160 1080 100">
    <rect x="100" y="160" width="1080" height="100" rx="16" fill="#F1F5F9"/>
    <use data-icon="tabler-filled/settings" x="128" y="182" width="28" height="28" fill="#1F4E79"/>
    <text x="172" y="204" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2933">マクロを改修する</text>
    <text x="1148" y="204" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F4E79">5 ファイルができる</text>
    <text x="172" y="238" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#5B6B7C">AI の返答を取り込み、改修済みブックを作る</text>
  </g>

  <g id="mode-ask" data-pptx-bounds="100 276 1080 100">
    <rect x="100" y="276" width="1080" height="100" rx="16" fill="#F1F5F9"/>
    <use data-icon="tabler-filled/message-chatbot" x="128" y="298" width="28" height="28" fill="#1F4E79"/>
    <text x="172" y="320" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2933">マクロについて AI に聞く</text>
    <text x="1148" y="320" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F4E79">2 ファイルができる</text>
    <text x="172" y="354" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#5B6B7C">依頼文とコード全文を作る</text>
  </g>

  <g id="flow-steps" data-pptx-bounds="104 430 1072 96">
    <line x1="348" y1="478" x2="374" y2="478" stroke="#4A87C4" stroke-width="3" marker-end="url(#flowArrow)"/>
    <line x1="624" y1="478" x2="650" y2="478" stroke="#4A87C4" stroke-width="3" marker-end="url(#flowArrow)"/>
    <line x1="900" y1="478" x2="926" y2="478" stroke="#4A87C4" stroke-width="3" marker-end="url(#flowArrow)"/>

    <rect x="104" y="430" width="244" height="96" rx="14" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
    <circle cx="134" cy="462" r="16" fill="#1F4E79"/>
    <text x="134" y="469" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="226" y="508" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2933">ブックを読み込む</text>

    <rect x="380" y="430" width="244" height="96" rx="14" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
    <circle cx="410" cy="462" r="16" fill="#1F4E79"/>
    <text x="410" y="469" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="502" y="508" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2933">AI へ依頼する</text>

    <rect x="656" y="430" width="244" height="96" rx="14" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
    <circle cx="686" cy="462" r="16" fill="#1F4E79"/>
    <text x="686" y="469" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="778" y="508" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2933">返答を取り込む</text>

    <rect x="932" y="430" width="244" height="96" rx="14" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
    <circle cx="962" cy="462" r="16" fill="#1F4E79"/>
    <text x="962" y="469" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">4</text>
    <text x="1054" y="508" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2933">ブックを作る</text>
  </g>

  <g id="flow-branch" data-pptx-bounds="380 526 500 114">
    <line x1="502" y1="526" x2="502" y2="576" stroke="#E07B39" stroke-width="3" marker-end="url(#branchArrow)"/>
    <rect x="380" y="584" width="500" height="56" rx="14" fill="#FFFFFF" stroke="#E07B39" stroke-width="2"/>
    <text x="630" y="619" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#E07B39">聞くだけの場合は、手順 2 で［完了］が出ます。</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="100 684 1080 24">
    <text x="100" y="702" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">第二部 操作マニュアル</text>
    <text x="1180" y="702" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">9</text>
  </g>
</svg>
