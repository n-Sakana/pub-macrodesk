<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="field" data-pptx-role="decoration" data-pptx-bounds="940 0 340 260">
    <circle cx="1250" cy="40" r="290" fill="#F1F5F9"/>
  </g>

  <g id="page-header" data-pptx-bounds="40 44 1200 78">
    <rect x="40" y="50" width="132" height="36" rx="18" fill="#1F4E79"/>
    <text x="106" y="75" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">第一部 · 5</text>
    <text x="190" y="86" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F2933">用意するものは 4 つだけ</text>
    <line x1="40" y1="118" x2="1240" y2="118" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <g id="req-1" data-pptx-bounds="40 160 1200 56">
    <text x="40" y="200" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#E2E8F0">1</text>
    <use data-icon="tabler-filled/settings" x="104" y="170" width="34" height="34" fill="#4A87C4"/>
    <text x="158" y="200" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="30" fill="#1F2933">Windows の PC と Excel</text>
  </g>

  <g id="req-2" data-pptx-bounds="40 240 1200 96">
    <text x="40" y="280" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#E2E8F0">2</text>
    <use data-icon="tabler-filled/message-chatbot" x="104" y="250" width="34" height="34" fill="#4A87C4"/>
    <text x="158" y="280" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="30" fill="#1F2933"><tspan x="158" dy="0">使える AI チャット</tspan><tspan x="158" dy="40">（Microsoft 365 Copilot Chat など、社内で許可されているもの）</tspan></text>
  </g>

  <g id="req-3" data-pptx-bounds="40 360 1200 56">
    <text x="40" y="400" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#E2E8F0">3</text>
    <use data-icon="tabler-filled/file-code" x="104" y="370" width="34" height="34" fill="#4A87C4"/>
    <text x="158" y="400" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="30" fill="#1F2933">直したいマクロ入りのブック</text>
  </g>

  <g id="req-4" data-pptx-bounds="40 440 1200 56">
    <text x="40" y="480" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#E2E8F0">4</text>
    <use data-icon="tabler-filled/player-play" x="104" y="450" width="34" height="34" fill="#4A87C4"/>
    <text x="158" y="480" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="30" fill="#1F2933"><tspan font-family="Consolas,monospace">launch.vbs</tspan> をダブルクリックするだけ</text>
  </g>

  <g id="note" data-pptx-bounds="40 552 1200 76">
    <rect x="40" y="552" width="1200" height="76" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
    <use data-icon="tabler-filled/circle-check" x="72" y="578" width="28" height="28" fill="#2E7D5B"/>
