<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-bounds="100 56 1080 136">
    <text x="100" y="100" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F4E79">用意するものは 4 つだけ</text>
    <text x="100" y="150" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="30" fill="#5B6B7C">特別な権限も、インストール作業も要らない</text>
    <rect x="100" y="188" width="1080" height="2" fill="#CBD5E1"/>
  </g>

  <g id="req-1" data-pptx-bounds="100 230 1080 44">
    <use data-icon="tabler-filled/settings" x="100" y="234" width="32" height="32" fill="#4A87C4"/>
    <text x="160" y="262" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">Windows の PC と Excel</text>
  </g>

  <g id="req-2" data-pptx-bounds="100 320 1080 44">
    <use data-icon="tabler-filled/message-chatbot" x="100" y="324" width="32" height="32" fill="#4A87C4"/>
    <text x="160" y="352" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">使える AI チャット（Microsoft 365 Copilot Chat など、社内で許可されているもの）</text>
  </g>

  <g id="req-3" data-pptx-bounds="100 410 1080 44">
    <use data-icon="tabler-filled/file-code" x="100" y="414" width="32" height="32" fill="#4A87C4"/>
    <text x="160" y="442" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">直したいマクロ入りのブック</text>
  </g>

  <g id="req-4" data-pptx-bounds="100 500 1080 44">
    <use data-icon="tabler-filled/player-play" x="100" y="504" width="32" height="32" fill="#4A87C4"/>
    <text x="160" y="532" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan font-family="Consolas,monospace">launch.vbs</tspan> をダブルクリックするだけ</text>
  </g>

  <g id="note" data-pptx-bounds="100 596 1080 64">
    <rect x="100" y="596" width="1080" height="64" rx="16" fill="#F1F5F9"/>
    <text x="132" y="636" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#E07B39">特別な権限やインストール作業は不要です。</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="100 684 1080 24">
    <text x="100" y="702" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">第一部 サービス説明</text>
    <text x="1180" y="702" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">6</text>
  </g>
