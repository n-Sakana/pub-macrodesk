    <text x="760" y="238" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="796" y="238" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">AIの返答のコードブロックを<tspan x="796" dy="34">先頭から末尾まで</tspan><tspan x="796" dy="34">全文コピーします。</tspan></text>

