    <text x="100" y="594" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">取り込めないときは、コードブロック全体を<tspan x="100" dy="34">もう一度コピーして押し直します。</tspan></text>
