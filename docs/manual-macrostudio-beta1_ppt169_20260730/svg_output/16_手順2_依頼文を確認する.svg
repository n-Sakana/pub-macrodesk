    <clipPath id="p16b-clip"><rect x="660" y="180" width="580" height="326" rx="10"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="40 44 1200 78">
    <rect x="40" y="50" width="228" height="36" rx="18" fill="#1F4E79"/>
    <text x="154" y="75" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">手順 2 · 依頼文を確認する</text>
    <text x="286" y="86" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F2933">AIへ送る依頼文を用意しました</text>
    <line x1="40" y1="118" x2="1240" y2="118" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <g id="shot-closed" data-pptx-bounds="36 144 588 400">
    <text x="40" y="166" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#5B6B7C">そのままの状態</text>
    <rect x="36" y="176" width="588" height="334" rx="14" fill="#F4F6F8"/>
    <image href="../images/08-request.png" x="40" y="180" width="580" height="326" preserveAspectRatio="xMidYMid meet" clip-path="url(#p16a-clip)"/>
    <rect x="40" y="180" width="580" height="326" rx="10" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <text x="40" y="536" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F2933">依頼文はできあがっています。そのまま進んで構いません</text>
  </g>

  <g id="shot-open" data-pptx-bounds="656 144 588 400">
    <text x="660" y="166" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#5B6B7C">「依頼文を確認・編集」を開いた状態</text>
    <rect x="656" y="176" width="588" height="334" rx="14" fill="#F4F6F8"/>
    <image href="../images/09-request-open.png" x="660" y="180" width="580" height="326" preserveAspectRatio="xMidYMid meet" clip-path="url(#p16b-clip)"/>
    <rect x="660" y="180" width="580" height="326" rx="10" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <text x="660" y="536" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F2933">直したいときだけ開きます。全文が編集できます</text>
  </g>

  <g id="notice" data-pptx-bounds="36 566 1208 86">
    <rect x="36" y="566" width="1208" height="86" rx="14" fill="#FFFFFF" stroke="#E07B39" stroke-width="2"/>
    <use data-icon="tabler-filled/alert-triangle" x="68" y="596" width="30" height="30" fill="#E07B39"/>
    <text x="116" y="606" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="116" dy="0" font-weight="bold">依頼文には毎回変わる依頼番号が入ります。</tspan><tspan x="116" dy="34">取り込むときの照合に使うので、消さないでください。</tspan></text>
