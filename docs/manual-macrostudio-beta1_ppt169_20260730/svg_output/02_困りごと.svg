<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="40 44 1200 78">
    <rect x="40" y="50" width="132" height="36" rx="18" fill="#1F4E79"/>
    <text x="106" y="75" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">第一部 · 1</text>
    <text x="190" y="86" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F2933">マクロは残っているのに、直せる人がいない</text>
    <line x1="40" y1="118" x2="1240" y2="118" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <g id="card-1" data-pptx-bounds="40 148 588 226">
    <rect x="40" y="148" width="588" height="226" rx="16" fill="#F4F6F8"/>
    <use data-icon="tabler-filled/file-code" x="76" y="180" width="44" height="44" fill="#4A87C4"/>
    <text x="76" y="286" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="30" fill="#1F2933"><tspan x="76" dy="0">業務マクロは部門ごとに育ち、</tspan><tspan x="76" dy="42">作った人はもう居ないことが多い。</tspan></text>
  </g>

  <g id="card-2" data-pptx-bounds="652 148 588 226">
    <rect x="652" y="148" width="588" height="226" rx="16" fill="#F4F6F8"/>
    <use data-icon="tabler-filled/user" x="688" y="180" width="44" height="44" fill="#4A87C4"/>
    <text x="688" y="264" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="30" fill="#1F2933"><tspan x="688" dy="0">直すには開発画面を開いて</tspan><tspan x="688" dy="42">コードを読む必要があり、</tspan><tspan x="688" dy="42">担当者には手が出ない。</tspan></text>
  </g>

  <g id="card-3" data-pptx-bounds="40 398 588 226">
    <rect x="40" y="398" width="588" height="226" rx="16" fill="#F4F6F8"/>
    <use data-icon="tabler-filled/alert-triangle" x="76" y="430" width="44" height="44" fill="#E07B39"/>
    <text x="76" y="536" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="30" fill="#1F2933"><tspan x="76" dy="0">端末やファイルの置き場所が</tspan><tspan x="76" dy="42">変わると動かなくなる。</tspan></text>
  </g>

  <g id="card-4" data-pptx-bounds="652 398 588 226">
    <rect x="652" y="398" width="588" height="226" rx="16" fill="#F4F6F8"/>
    <use data-icon="tabler-filled/clock" x="688" y="430" width="44" height="44" fill="#4A87C4"/>
    <text x="688" y="536" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="30" fill="#1F2933"><tspan x="688" dy="0">詳しい人に頼むと順番待ちになり、</tspan><tspan x="688" dy="42">業務が止まる。</tspan></text>
  </g>

  <g id="claim" data-pptx-bounds="40 640 1200 36">
    <text x="40" y="666" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F4E79">直せないのは能力の問題ではなく、直すのに開発の知識が要るからです。</text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="40 682 1200 26">
    <text x="40" y="700" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">第一部 サービス説明</text>
    <text x="1240" y="700" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">02</text>
