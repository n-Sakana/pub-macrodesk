<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <clipPath id="p15a-clip"><rect x="40" y="180" width="384" height="216" rx="10"/></clipPath>
    <clipPath id="p15b-clip"><rect x="448" y="180" width="384" height="216" rx="10"/></clipPath>
    <clipPath id="p15c-clip"><rect x="856" y="180" width="384" height="216" rx="10"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="40 44 1200 78">
    <rect x="40" y="50" width="204" height="36" rx="18" fill="#1F4E79"/>
    <text x="142" y="75" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">手順 2 · 質問に答える</text>
    <text x="262" y="86" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F2933">いくつか教えてください</text>
    <text x="1240" y="84" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#5B6B7C">ひな形に質問がある場合だけ出ます</text>
    <line x1="40" y1="118" x2="1240" y2="118" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <g id="shot-choice" data-pptx-bounds="36 144 392 292">
    <text x="40" y="166" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#5B6B7C">選択式の問</text>
    <rect x="36" y="176" width="392" height="224" rx="14" fill="#F4F6F8"/>
    <image href="../images/22-questions.png" x="40" y="180" width="384" height="216" preserveAspectRatio="xMidYMid meet" clip-path="url(#p15a-clip)"/>
    <rect x="40" y="180" width="384" height="216" rx="10" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <text x="40" y="426" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F2933">ボタンを 1 回押すだけ</text>
  </g>

  <g id="shot-text" data-pptx-bounds="444 144 392 292">
    <text x="448" y="166" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#5B6B7C">自由記述の問</text>
    <rect x="444" y="176" width="392" height="224" rx="14" fill="#F4F6F8"/>
    <image href="../images/23-questions-text.png" x="448" y="180" width="384" height="216" preserveAspectRatio="xMidYMid meet" clip-path="url(#p15b-clip)"/>
    <rect x="448" y="180" width="384" height="216" rx="10" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <text x="448" y="426" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F2933">複数行で書けます</text>
  </g>

  <g id="shot-last" data-pptx-bounds="852 144 392 292">
    <text x="856" y="166" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#5B6B7C">問数が多いとき</text>
    <rect x="852" y="176" width="392" height="224" rx="14" fill="#F4F6F8"/>
    <image href="../images/24-questions-last.png" x="856" y="180" width="384" height="216" preserveAspectRatio="xMidYMid meet" clip-path="url(#p15c-clip)"/>
    <rect x="856" y="180" width="384" height="216" rx="10" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <text x="856" y="426" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F2933">中間の丸が省略されます</text>
  </g>

  <g id="steps" data-pptx-bounds="36 456 796 196">
    <circle cx="60" cy="482" r="19" fill="#1F4E79"/>
    <text x="60" y="490" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="96" y="490" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">質問は 1 問ずつ。上の丸が進捗で、答えた問は色が付きます。</text>

    <circle cx="60" cy="542" r="19" fill="#1F4E79"/>
    <text x="60" y="550" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="96" y="550" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">移動は左右の矢印、または丸を直接クリックします。</text>

    <circle cx="60" cy="602" r="19" fill="#1F4E79"/>
    <text x="60" y="610" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="96" y="610" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">答えた内容は、次の画面の依頼文に折り込まれます。</text>
  </g>

  <g id="claim" data-pptx-bounds="852 456 392 196">
    <rect x="852" y="456" width="392" height="196" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
    <use data-icon="tabler-filled/circle-check" x="884" y="486" width="30" height="30" fill="#2E7D5B"/>
    <text x="884" y="536" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2933"><tspan x="884" dy="0">分かるところだけで</tspan><tspan x="884" dy="34">大丈夫です。1 問以上</tspan><tspan x="884" dy="34">答えると［次へ］が</tspan><tspan x="884" dy="34">使えます。</tspan></text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="40 668 1200 32">
    <text x="40" y="692" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">第二部 操作マニュアル</text>
    <text x="1240" y="692" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">15</text>
  </g>
</svg>
