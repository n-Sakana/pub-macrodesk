    <text x="1068" y="552" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#1F2933"><tspan x="1068" dy="0">両方のボタンを</tspan><tspan x="1068" dy="28">押すまで［次へ］</tspan><tspan x="1068" dy="28">は使えません。</tspan></text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="40 668 1200 32">
    <text x="40" y="692" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">第二部 操作マニュアル ／ 聞くだけの場合はここで［完了］になります</text>
    <text x="1240" y="692" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">17</text>
