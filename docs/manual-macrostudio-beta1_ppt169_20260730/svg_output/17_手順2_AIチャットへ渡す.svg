    <image href="../images/10-handoff.png" x="40" y="148" width="672" height="378" preserveAspectRatio="xMidYMid meet" clip-path="url(#p17-clip)"/>
    <rect x="40" y="148" width="672" height="378" rx="10" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <g id="on-screen" data-pptx-bounds="36 550 680 102">
