    <text x="62" y="578" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#5B6B7C">画面に出る案内</text>
    <text x="62" y="610" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F2933"><tspan x="62" dy="0">マクロが読み書きするExcelシートやファイルがあれば、それも</tspan><tspan x="62" dy="28">一緒にAIチャットへ添付すると、より正確な回答が得られます。</tspan></text>
  </g>

  <g id="steps" data-pptx-bounds="736 144 504 300">
    <text x="736" y="166" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#5B6B7C">［次へ］を押した時点で専用フォルダが作られます</text>

    <circle cx="760" cy="210" r="19" fill="#1F4E79"/>
    <text x="760" y="218" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="796" y="218" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="796" dy="0">［依頼文をコピー］を押す。</tspan><tspan x="796" dy="34">クリップボードに入ります。</tspan></text>

    <circle cx="760" cy="300" r="19" fill="#1F4E79"/>
    <text x="760" y="308" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="796" y="308" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="796" dy="0">［ファイルの場所を開く］を押す。</tspan><tspan x="796" dy="34">エクスプローラーが開きます。</tspan></text>

    <circle cx="760" cy="390" r="19" fill="#1F4E79"/>
    <text x="760" y="398" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="796" y="398" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="796" dy="0">AIチャットに貼り付け、</tspan><tspan x="796" dy="34">source-code.md を添付して送信。</tspan></text>
  </g>

  <g id="shot-after" data-pptx-bounds="736 462 288 198">
    <rect x="736" y="462" width="288" height="166" rx="12" fill="#F4F6F8"/>
