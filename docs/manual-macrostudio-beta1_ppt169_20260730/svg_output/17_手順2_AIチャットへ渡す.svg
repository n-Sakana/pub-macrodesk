    <rect x="740" y="466" width="280" height="158" rx="8" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <text x="736" y="648" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" fill="#5B6B7C">両方押したあと。［次へ］が使えます</text>
