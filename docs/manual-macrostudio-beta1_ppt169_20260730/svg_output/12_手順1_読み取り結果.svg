  <g id="shot-open" data-pptx-bounds="656 144 588 400">
    <text x="660" y="166" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#5B6B7C">「読み取った内容を見る」を開いた状態</text>
