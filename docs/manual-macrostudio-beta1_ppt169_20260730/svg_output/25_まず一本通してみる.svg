    <text x="132" y="486" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" fill="#5B6B7C"><tspan x="132" dy="0">画面は MacroStudio ベータ版 1.0.0 のものです。ベータ版のため、画面の文言や配置は今後変わることがあります。</tspan><tspan x="132" dy="34">掲載しているスクリーンショットは、サンプルのブック（受注管理.xlsm）を読み込んだ実画面です。</tspan><tspan x="132" dy="34">フォルダのパスや日時は説明用の例です。</tspan><tspan x="132" dy="34">判断は AI が行います。最後に Excel で開いて動作を確認するのは人です。</tspan></text>
  </g>

