    <use data-icon="tabler-filled/player-play" x="72" y="200" width="36" height="36" fill="#1F4E79"/>
    <text x="120" y="228" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="32" font-weight="bold" fill="#1F4E79">用意するもの</text>
    <circle cx="86" cy="290" r="8" fill="#4A87C4"/>
    <text x="112" y="298" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">改修したいブック<tspan x="112" dy="34">（.xlsm / .xlam / .xlsb / .xls）</tspan></text>
    <circle cx="86" cy="382" r="8" fill="#4A87C4"/>
    <text x="112" y="390" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">ファイルを添付できるAIチャット</text>
    <circle cx="86" cy="440" r="8" fill="#4A87C4"/>
    <text x="112" y="448" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">Windows 10・11<tspan x="112" dy="34">（インストールは不要）</tspan></text>
  </g>

  <g id="card-fit" data-pptx-bounds="652 168 588 340">
    <rect x="652" y="168" width="588" height="340" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <use data-icon="tabler-filled/file-code" x="684" y="200" width="36" height="36" fill="#1F4E79"/>
    <text x="732" y="228" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="32" font-weight="bold" fill="#1F4E79">向いているマクロ</text>
    <circle cx="698" cy="290" r="8" fill="#4A87C4"/>
    <text x="724" y="298" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">部門で使っている独自のマクロ</text>
    <circle cx="698" cy="348" r="8" fill="#4A87C4"/>
    <text x="724" y="356" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">新しい端末で動かなくなったマクロ</text>
    <circle cx="698" cy="406" r="8" fill="#4A87C4"/>
    <text x="724" y="414" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">作った人がいなくなったマクロ</text>
