    <text x="796" y="468" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">コードが長くて返答が途中で<tspan x="796" dy="34">切れるときは「モジュール</tspan><tspan x="796" dy="34">単位出力」に印を付けます。</tspan></text>
