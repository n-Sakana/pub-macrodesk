    <text x="92" y="488" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="30" fill="#1F2933"><tspan x="92" dy="0">直ったマクロを実際に動かして確かめること。</tspan><tspan x="92" dy="42">最後に Excel で開いて確認するのは人。</tspan></text>
