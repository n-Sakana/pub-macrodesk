<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-bounds="100 56 1080 136">
    <text x="100" y="100" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F4E79">このツールがやらないこと</text>
    <text x="100" y="150" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="30" fill="#5B6B7C">判断と最終確認は人と AI に残す。だから壊れない</text>
    <rect x="100" y="188" width="1080" height="2" fill="#CBD5E1"/>
  </g>

  <g id="dont-1" data-pptx-bounds="100 226 1080 44">
    <use data-icon="tabler-filled/circle-x" x="100" y="230" width="30" height="30" fill="#5B6B7C"/>
    <text x="160" y="256" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">どこをどう直すかを決めること。それは AI に聞く。</text>
  </g>

  <g id="dont-2" data-pptx-bounds="100 310 1080 44">
    <use data-icon="tabler-filled/circle-x" x="100" y="314" width="30" height="30" fill="#5B6B7C"/>
    <text x="160" y="340" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">元のブックを書き換えること。必ず別名で作る。</text>
  </g>

  <g id="dont-3" data-pptx-bounds="100 394 1080 78">
    <use data-icon="tabler-filled/circle-x" x="100" y="398" width="30" height="30" fill="#5B6B7C"/>
    <text x="160" y="424" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="160" dy="0">マクロを勝手に増やして構造を変えること。</tspan><tspan x="160" dy="34">増やせる範囲は限ってある（詳しくは第二部）。</tspan></text>
  </g>

  <g id="dont-4" data-pptx-bounds="100 512 1080 44">
    <use data-icon="tabler-filled/circle-x" x="100" y="516" width="30" height="30" fill="#5B6B7C"/>
    <text x="160" y="542" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">直ったマクロを実際に動かして確かめること。最後に Excel で開いて確認するのは人。</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="100 684 1080 24">
    <text x="100" y="702" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">第一部 サービス説明</text>
    <text x="1180" y="702" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">7</text>
  </g>
</svg>
