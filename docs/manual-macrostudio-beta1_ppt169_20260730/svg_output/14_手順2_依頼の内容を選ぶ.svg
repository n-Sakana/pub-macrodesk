    <text x="100" y="572" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F2933"><tspan x="100" dy="0">「AIに聞く」を選んだ場合、この画面の見出しは</tspan><tspan x="100" dy="28">「AIに何を聞くか選びます」になります。</tspan><tspan x="100" dy="28">ひな形は自分たちで増やせます。</tspan></text>
  </g>

  <g id="presets" data-pptx-bounds="628 144 612 508">
    <rect x="628" y="144" width="612" height="52" rx="12" fill="#F1F5F9"/>
    <text x="656" y="176" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#5B6B7C">同梱している 6 つのひな形</text>

    <rect x="628" y="206" width="76" height="28" rx="14" fill="#1F4E79"/>
    <text x="666" y="226" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">改修</text>
    <text x="720" y="226" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#1F2933">VBAリファクター</text>
    <text x="720" y="252" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" fill="#5B6B7C">動作を変えずに、読みやすさ・速さ・壊れにくさを直す</text>

    <rect x="628" y="278" width="76" height="28" rx="14" fill="#1F4E79"/>
    <text x="666" y="298" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">改修</text>
    <text x="720" y="298" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#1F2933">Win32 API を使わない形へ直す</text>
    <text x="720" y="324" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" fill="#5B6B7C">依存した箇所を、VBA 標準機能だけの形へ置き換える</text>

    <rect x="628" y="350" width="76" height="28" rx="14" fill="#1F4E79"/>
    <text x="666" y="370" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">改修</text>
    <text x="720" y="370" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#1F2933">自分で改修内容を書く</text>
    <text x="720" y="396" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" fill="#5B6B7C">改修してほしい内容を自分の言葉で書く</text>

    <rect x="628" y="422" width="76" height="28" rx="14" fill="#4A87C4"/>
    <text x="666" y="442" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">聞く</text>
    <text x="720" y="442" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#1F2933">新しい端末で動くかを調べてもらう</text>
    <text x="720" y="468" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" fill="#5B6B7C">動かなくなる箇所と直し方の方針を挙げてもらう</text>

    <rect x="628" y="494" width="76" height="28" rx="14" fill="#4A87C4"/>
    <text x="666" y="514" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">聞く</text>
    <text x="720" y="514" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#1F2933">相談用の依頼文を作る</text>
    <text x="720" y="540" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" fill="#5B6B7C">質問に答え、AI と方針を決めるための 1 通目を作る</text>

    <rect x="628" y="566" width="76" height="28" rx="14" fill="#4A87C4"/>
    <text x="666" y="586" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">聞く</text>
    <text x="720" y="586" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#1F2933">聞きたいことを自分で書く</text>
    <text x="720" y="612" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" fill="#5B6B7C">聞きたいことを自分の言葉で書く</text>
  </g>

