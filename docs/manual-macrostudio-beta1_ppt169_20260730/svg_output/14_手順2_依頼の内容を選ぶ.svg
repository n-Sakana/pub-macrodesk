    <rect x="40" y="148" width="560" height="315" rx="10" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <text x="40" y="497" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#5B6B7C">一覧に出る名前は、ファイル名ではなくひな形の見出しです</text>
