<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <clipPath id="p03-shot-clip"><rect x="600" y="196" width="600" height="338" rx="10"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="40 44 1200 78">
    <rect x="40" y="50" width="132" height="36" rx="18" fill="#1F4E79"/>
    <text x="106" y="75" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">第一部 · 2</text>
    <text x="190" y="86" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F2933">直しかたを考えるのは AI。こちらは選ぶだけ</text>
    <line x1="40" y1="118" x2="1240" y2="118" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <g id="point-1" data-pptx-bounds="40 148 520 108">
    <use data-icon="tabler-filled/circle-check" x="40" y="152" width="28" height="28" fill="#1F4E79"/>
    <text x="82" y="176" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="82" dy="0" font-weight="bold">コードを読み書きできなくても、</tspan><tspan x="82" dy="34" font-weight="bold">マクロを直せる。</tspan><tspan>直しかたを考える</tspan><tspan x="82" dy="34">のは AI。画面に出てくることに答えるだけ。</tspan></text>
  </g>

  <g id="point-2" data-pptx-bounds="40 272 520 74">
    <use data-icon="tabler-filled/circle-check" x="40" y="276" width="28" height="28" fill="#1F4E79"/>
    <text x="82" y="300" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="82" dy="0" font-weight="bold">開発画面を一度も開かない。</tspan><tspan>案内どおりに</tspan><tspan x="82" dy="34">［次へ］を押していけば終わる。</tspan></text>
  </g>

  <g id="point-3" data-pptx-bounds="40 362 520 74">
    <use data-icon="tabler-filled/shield-check" x="40" y="366" width="28" height="28" fill="#2E7D5B"/>
    <text x="82" y="390" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="82" dy="0" font-weight="bold">元のブックはそのまま残る。</tspan><tspan>直したものは</tspan><tspan x="82" dy="34">別名の新しいブックとして作られる。</tspan></text>
  </g>

  <g id="point-4" data-pptx-bounds="40 452 520 74">
    <use data-icon="tabler-filled/eye" x="40" y="456" width="28" height="28" fill="#1F4E79"/>
    <text x="82" y="480" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="82" dy="0" font-weight="bold">鵜呑みにしなくていい。</tspan><tspan>どこが変わったのかを</tspan><tspan x="82" dy="34">見てから、作るかどうかを決められる。</tspan></text>
  </g>

  <g id="point-5" data-pptx-bounds="40 542 520 108">
    <use data-icon="tabler-filled/message-chatbot" x="40" y="546" width="28" height="28" fill="#1F4E79"/>
    <text x="82" y="570" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="82" dy="0" font-weight="bold">直さずに、聞くだけでもいい。</tspan><tspan>「新しい端末</tspan><tspan x="82" dy="34">で動くか」「どう直すのが良いか」を AI に</tspan><tspan x="82" dy="34">相談するところで終わってもよい。</tspan></text>
  </g>

  <g id="shot" data-pptx-bounds="596 192 608 408">
    <rect x="596" y="192" width="608" height="346" rx="14" fill="#F4F6F8"/>
    <image href="../images/05-mode.png" x="600" y="196" width="600" height="338" preserveAspectRatio="xMidYMid meet" clip-path="url(#p03-shot-clip)"/>
    <rect x="600" y="196" width="600" height="338" rx="10" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <text x="596" y="576" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" fill="#5B6B7C">利用者がすることは、この 2 枚から選ぶこと</text>
  </g>

  <g id="claim" data-pptx-bounds="596 604 644 62">
    <rect x="596" y="604" width="644" height="62" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
    <use data-icon="tabler-filled/circle-check" x="620" y="622" width="26" height="26" fill="#2E7D5B"/>
    <text x="658" y="643" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2933">AIチャットが使えれば、マクロは直せる。</text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="40 682 1200 26">
    <text x="40" y="700" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">第一部 サービス説明</text>
    <text x="1240" y="700" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">03</text>
  </g>
</svg>
