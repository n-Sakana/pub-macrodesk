<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <clipPath id="p21-clip"><rect x="40" y="148" width="672" height="378" rx="10"/></clipPath>
    <clipPath id="p21b-clip"><rect x="740" y="356" width="240" height="135" rx="8"/></clipPath>
    <clipPath id="p21c-clip"><rect x="1000" y="356" width="240" height="135" rx="8"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="40 44 1200 78">
    <rect x="40" y="50" width="116" height="36" rx="18" fill="#1F4E79"/>
    <text x="98" y="75" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">手順 4</text>
    <text x="174" y="86" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F2933">改修済みブックを作ります</text>
    <text x="1240" y="84" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F4E79">別名の新しいブックができます</text>
    <line x1="40" y1="118" x2="1240" y2="118" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <g id="shot" data-pptx-bounds="36 144 680 386">
    <rect x="36" y="144" width="680" height="386" rx="14" fill="#F4F6F8"/>
    <image href="../images/17-output-name.png" x="40" y="148" width="672" height="378" preserveAspectRatio="xMidYMid meet" clip-path="url(#p21-clip)"/>
    <rect x="40" y="148" width="672" height="378" rx="10" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <g id="name-note" data-pptx-bounds="36 550 680 102">
    <rect x="36" y="550" width="680" height="102" rx="14" fill="#F4F6F8"/>
    <text x="62" y="582" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F2933"><tspan x="62" dy="0">既定の出力名は「ブック名_macrostudio.xlsm」。名前はファイル名</tspan><tspan x="62" dy="28">だけを入れます。区切り文字や、元と違う拡張子は使えません。</tspan></text>
  </g>

  <g id="step-label" data-pptx-bounds="736 144 504 156">
    <text x="736" y="176" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#5B6B7C">1. 出力ファイル名を確認する</text>
    <text x="736" y="216" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="736" dy="0">書き戻したあとブックを読み直して、</tspan><tspan x="736" dy="34">意図どおり書き込まれたかを</tspan><tspan x="736" dy="34">検証しています。</tspan></text>
  </g>

  <g id="shot-building" data-pptx-bounds="736 316 248 220">
    <text x="736" y="340" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#5B6B7C">2. ビルド中</text>
    <rect x="736" y="352" width="248" height="143" rx="12" fill="#F4F6F8"/>
    <image href="../images/18-building.png" x="740" y="356" width="240" height="135" preserveAspectRatio="xMidYMid meet" clip-path="url(#p21b-clip)"/>
    <rect x="740" y="356" width="240" height="135" rx="8" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <text x="736" y="518" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" fill="#5B6B7C">自動で進みます（通常 1〜2 秒）</text>
  </g>

  <g id="shot-done" data-pptx-bounds="996 316 248 220">
    <text x="996" y="340" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#5B6B7C">3. 完成</text>
    <rect x="996" y="352" width="248" height="143" rx="12" fill="#F4F6F8"/>
    <image href="../images/19-done.png" x="1000" y="356" width="240" height="135" preserveAspectRatio="xMidYMid meet" clip-path="url(#p21c-clip)"/>
    <rect x="1000" y="356" width="240" height="135" rx="8" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <text x="996" y="518" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" fill="#5B6B7C">右下が［完了］になります</text>
  </g>

  <g id="final-note" data-pptx-bounds="736 548 504 104">
    <rect x="736" y="548" width="504" height="64" rx="14" fill="#FFFFFF" stroke="#E07B39" stroke-width="2"/>
    <use data-icon="tabler-filled/alert-triangle" x="762" y="566" width="28" height="28" fill="#E07B39"/>
    <text x="800" y="589" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2933">最後に Excel で開いて確認を。</text>
    <text x="736" y="644" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">［完了］で最初の画面へ戻ります。</text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="40 674 1200 32">
    <text x="40" y="698" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">第二部 操作マニュアル</text>
    <text x="1240" y="698" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">21</text>
  </g>
</svg>
