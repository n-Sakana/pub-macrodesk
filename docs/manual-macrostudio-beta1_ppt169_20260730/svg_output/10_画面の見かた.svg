<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <clipPath id="p10-clip"><rect x="40" y="148" width="672" height="378" rx="10"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="40 44 1200 78">
    <rect x="40" y="50" width="168" height="36" rx="18" fill="#1F4E79"/>
    <text x="124" y="75" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">画面の見かた</text>
    <text x="226" y="86" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F2933">起動すると、この画面から始まります</text>
    <line x1="40" y1="118" x2="1240" y2="118" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <g id="shot" data-pptx-bounds="36 144 680 386">
    <rect x="36" y="144" width="680" height="386" rx="14" fill="#F4F6F8"/>
    <image href="../images/01-drop.png" x="40" y="148" width="672" height="378" preserveAspectRatio="xMidYMid meet" clip-path="url(#p10-clip)"/>
    <rect x="40" y="148" width="672" height="378" rx="10" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="188" cy="176" r="19" fill="#1F4E79" stroke="#FFFFFF" stroke-width="3"/>
    <text x="188" y="184" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">1</text>
    <circle cx="106" cy="498" r="19" fill="#1F4E79" stroke="#FFFFFF" stroke-width="3"/>
    <text x="106" y="506" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">2</text>
    <circle cx="680" cy="176" r="19" fill="#1F4E79" stroke="#FFFFFF" stroke-width="3"/>
    <text x="680" y="184" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">3</text>
    <circle cx="600" cy="176" r="19" fill="#1F4E79" stroke="#FFFFFF" stroke-width="3"/>
    <text x="600" y="184" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">4</text>
  </g>

  <g id="launch-note" data-pptx-bounds="36 550 680 102">
    <rect x="36" y="550" width="680" height="102" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
    <use data-icon="tabler-filled/player-play" x="62" y="572" width="28" height="28" fill="#2E7D5B"/>
    <text x="100" y="594" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="100" dy="0">起動は </tspan><tspan font-family="Consolas,monospace">launch.vbs</tspan><tspan> をダブルクリック。</tspan><tspan x="100" dy="34">黒いコマンド画面は出ません。小さな読み込み画面のあと本画面になります。</tspan></text>
  </g>

  <g id="legend" data-pptx-bounds="736 144 504 508">
    <circle cx="760" cy="172" r="19" fill="#1F4E79"/>
    <text x="760" y="180" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="796" y="180" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="796" dy="0">上部の帯が進捗です。最初は</tspan><tspan x="796" dy="34">「ブックを読み込む」だけが出て、</tspan><tspan x="796" dy="34">目的を選ぶと先の手順が現れます。</tspan><tspan x="796" dy="34">改修なら 4 手順、聞くだけなら 2 手順。</tspan></text>

    <circle cx="760" cy="352" r="19" fill="#1F4E79"/>
    <text x="760" y="360" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="796" y="360" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="796" dy="0">左下に「いま何をすればよいか」が</tspan><tspan x="796" dy="34">1 行で出ます。</tspan></text>

    <circle cx="760" cy="464" r="19" fill="#1F4E79"/>
    <text x="760" y="472" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="796" y="472" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="796" dy="0">右上の月／太陽でライト・ダークを</tspan><tspan x="796" dy="34">切り替え。次回も維持されます。</tspan></text>

    <circle cx="760" cy="576" r="19" fill="#1F4E79"/>
    <text x="760" y="584" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">4</text>
    <text x="796" y="584" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="796" dy="0">対応形式は .xlsm / .xlam /</tspan><tspan x="796" dy="34">.xlsb / .xls。</tspan></text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="40 668 1200 32">
    <text x="40" y="692" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">第二部 操作マニュアル</text>
    <text x="1240" y="692" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">10</text>
  </g>
