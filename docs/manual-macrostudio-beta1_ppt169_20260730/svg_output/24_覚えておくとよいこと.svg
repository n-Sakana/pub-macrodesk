<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="40 44 1200 78">
    <rect x="40" y="50" width="216" height="36" rx="18" fill="#1F4E79"/>
    <text x="148" y="75" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">覚えておくとよいこと</text>
    <text x="274" y="86" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F2933">運用に入る前に、2 つだけ</text>
    <line x1="40" y1="118" x2="1240" y2="118" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <g id="limit" data-pptx-bounds="40 144 588 200">
    <rect x="40" y="144" width="588" height="200" rx="16" fill="#F4F6F8"/>
    <rect x="40" y="144" width="588" height="7" rx="3.5" fill="#E07B39"/>
    <use data-icon="tabler-filled/settings" x="72" y="180" width="30" height="30" fill="#E07B39"/>
    <text x="116" y="204" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2933">増やせるのは標準モジュールだけ</text>
    <text x="72" y="252" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="72" dy="0">既存のクラスモジュールやシートの</tspan><tspan x="72" dy="34">モジュールを直すことはできます。新しい</tspan><tspan x="72" dy="34">クラスやフォームを含む返答は取り込みません。</tspan></text>
  </g>

  <g id="preset-howto" data-pptx-bounds="652 144 588 200">
    <rect x="652" y="144" width="588" height="200" rx="16" fill="#F4F6F8"/>
    <rect x="652" y="144" width="588" height="7" rx="3.5" fill="#1F4E79"/>
    <use data-icon="tabler-filled/list-check" x="684" y="180" width="30" height="30" fill="#1F4E79"/>
    <text x="728" y="204" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2933">ひな形は自分で増やせる</text>
    <text x="684" y="252" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="684" dy="0">presets フォルダに Markdown ファイル</tspan><tspan x="684" dy="34">（UTF-8）を置くと、ファイル 1 つにつき 1 件、</tspan><tspan x="684" dy="34">目的の画面に自動で現れます。再起動は不要。</tspan></text>
  </g>

  <g id="preset-rules" data-pptx-bounds="652 356 588 152">
    <text x="684" y="382" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F2933"><tspan x="684" dy="0">・最初の「# ...」が一覧に出る名前です。</tspan><tspan x="684" dy="28">・「## 用途」に「改修」か「診断」と書くと、</tspan><tspan x="684" dy="28">　その使いかたの一覧に並びます。</tspan><tspan x="684" dy="28">・「## 質問」を書くと質問画面が出ます。</tspan><tspan x="684" dy="28">・書式が足りないファイルは理由付きで出ます。</tspan></text>
  </g>

  <g id="trouble-label" data-pptx-bounds="40 354 588 40">
    <use data-icon="tabler-filled/alert-triangle" x="40" y="358" width="26" height="26" fill="#E07B39"/>
    <text x="78" y="380" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F4E79">うまくいかないとき</text>
  </g>

  <g id="trouble" data-pptx-replace-with="table" data-pptx-bounds="40 396 588 266">
    <metadata type="application/json">{"name":"p24-troubleshooting","columns":["症状","対処"],"rows":[["起動しない・白い画面のまま","WebView2 ランタイムが未導入の可能性。起動時の案内に従う"],["返答を取り込めない","コードブロック全体をコピーし直す"],["ひな形が一覧に出ない","Markdown の見出しが揃っているか確認する"],["ビルドに失敗した","元のファイルは無事なので何度でもやり直せる"]],"style":{"font_family":"'Yu Gothic UI','Segoe UI',sans-serif","font_size":20,"colors":["#1F4E79","#F4F6F8"]}}</metadata>
    <rect x="40" y="396" width="588" height="60" rx="10" fill="#F4F6F8"/>
    <text x="68" y="422" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#1F2933">起動しない・白い画面のまま</text>
    <text x="68" y="446" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#5B6B7C">WebView2 ランタイムが未導入の可能性。起動時の案内に従う</text>

    <rect x="40" y="464" width="588" height="60" rx="10" fill="#F4F6F8"/>
    <text x="68" y="490" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#1F2933">返答を取り込めない</text>
    <text x="68" y="514" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#5B6B7C">コードブロック全体をコピーし直す</text>

    <rect x="40" y="532" width="588" height="60" rx="10" fill="#F4F6F8"/>
    <text x="68" y="558" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#1F2933">ひな形が一覧に出ない</text>
    <text x="68" y="582" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#5B6B7C">Markdown の見出しが揃っているか確認する</text>

    <rect x="40" y="600" width="588" height="60" rx="10" fill="#F4F6F8"/>
    <text x="68" y="626" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#1F2933">ビルドに失敗した</text>
    <text x="68" y="650" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#5B6B7C">元のファイルは無事なので何度でもやり直せる</text>
  </g>

  <g id="preset-sample" data-pptx-bounds="652 512 588 140">
    <rect x="652" y="512" width="588" height="140" rx="14" fill="#F4F6F8"/>
    <text x="684" y="544" font-family="Consolas,monospace" font-size="20" fill="#5B6B7C"><tspan x="684" dy="0"># ひな形の名前</tspan><tspan x="684" dy="28">## 用途 → 改修 / 診断</tspan><tspan x="684" dy="28">## 改修指示 → 依頼文の本文</tspan><tspan x="684" dy="28">## 出力指示 → 返答のしかた</tspan></text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="40 678 1200 30">
    <text x="1240" y="700" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">24</text>
  </g>
</svg>
