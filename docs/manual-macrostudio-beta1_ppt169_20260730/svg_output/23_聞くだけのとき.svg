    <image href="../images/25-request-diagnose.png" x="40" y="446" width="384" height="216" preserveAspectRatio="xMidYMid meet" clip-path="url(#p23c-clip)"/>
    <rect x="40" y="446" width="384" height="216" rx="10" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  </g>

