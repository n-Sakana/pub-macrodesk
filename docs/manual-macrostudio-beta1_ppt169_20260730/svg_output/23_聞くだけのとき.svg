    <text x="896" y="286" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="896" dy="0">「AIチャットへ質問します」</tspan><tspan x="896" dy="34">で終わりです。右下が</tspan><tspan x="896" dy="34">［完了］になります。</tspan></text>
  </g>

  <g id="result-note" data-pptx-bounds="864 414 376 180">
    <rect x="864" y="414" width="376" height="180" rx="16" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
