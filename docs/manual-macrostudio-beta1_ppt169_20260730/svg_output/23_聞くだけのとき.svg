    <text x="896" y="500" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2933"><tspan x="896" dy="0">できるのは 2 ファイル</tspan><tspan x="896" dy="34">だけ。ブックは変更</tspan><tspan x="896" dy="34">されません。</tspan></text>
