    <line x1="40" y1="118" x2="1240" y2="118" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <g id="shot-1" data-pptx-bounds="36 144 392 264">
    <text x="40" y="166" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#5B6B7C">1. 「マクロについてAIに聞く」を選ぶ</text>
    <rect x="36" y="176" width="392" height="224" rx="14" fill="#F4F6F8"/>
    <image href="../images/20-mode-diagnose.png" x="40" y="180" width="384" height="216" preserveAspectRatio="xMidYMid meet" clip-path="url(#p23a-clip)"/>
    <rect x="40" y="180" width="384" height="216" rx="10" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  </g>

