    <text x="448" y="166" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#5B6B7C">2. 「AIに何を聞くか選びます」に変わる</text>
    <rect x="444" y="176" width="392" height="224" rx="14" fill="#F4F6F8"/>
    <image href="../images/21-purpose-diagnose.png" x="448" y="180" width="384" height="216" preserveAspectRatio="xMidYMid meet" clip-path="url(#p23b-clip)"/>
    <rect x="448" y="180" width="384" height="216" rx="10" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  </g>

