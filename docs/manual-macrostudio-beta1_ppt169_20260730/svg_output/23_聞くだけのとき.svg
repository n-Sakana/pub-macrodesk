  <g id="question-note" data-pptx-bounds="864 610 376 62">
    <text x="864" y="634" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#5B6B7C"><tspan x="864" dy="0">質問のあるひな形なら、</tspan><tspan x="864" dy="28">先に 1 問ずつ答えます。</tspan></text>
