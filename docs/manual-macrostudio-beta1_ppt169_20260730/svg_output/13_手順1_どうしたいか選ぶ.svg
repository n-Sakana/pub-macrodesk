<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="step-mark" data-pptx-role="decoration" data-pptx-bounds="100 36 100 122">
    <text x="100" y="120" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="96" font-weight="bold" fill="#E2E8F0">1</text>
  </g>

  <g id="header" data-pptx-bounds="200 40 980 120">
    <text x="200" y="62" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" fill="#5B6B7C">手順 1 ・ 3/3</text>
    <text x="200" y="106" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F4E79">このマクロをどうしたいか選びます</text>
    <text x="200" y="150" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="30" fill="#5B6B7C">選んでも自動では進まない。［次へ］で確定する</text>
  </g>

  <g id="choice-refactor" data-pptx-bounds="100 190 560 124">
    <rect x="100" y="190" width="560" height="124" rx="14" fill="#F1F5F9"/>
    <text x="128" y="228" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2933">マクロを改修する</text>
    <text x="128" y="264" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#5B6B7C"><tspan x="128" dy="0">AIの返答を取り込んで、改修済みの</tspan><tspan x="128" dy="34">ブックをこのアプリで作ります。</tspan></text>
  </g>

  <g id="choice-ask" data-pptx-bounds="100 330 560 124">
    <rect x="100" y="330" width="560" height="124" rx="14" fill="#F1F5F9"/>
    <text x="128" y="368" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2933">マクロについてAIに聞く</text>
    <text x="128" y="404" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#5B6B7C"><tspan x="128" dy="0">AIチャットへ渡す依頼文とコードを</tspan><tspan x="128" dy="34">作ります。ブックは変更しません。</tspan></text>
  </g>

  <g id="notice" data-pptx-bounds="100 470 560 78">
    <text x="100" y="498" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#E07B39"><tspan x="100" dy="0">選んでも自動では進みません。</tspan><tspan x="100" dy="34">［次へ］で確定します。</tspan></text>
  </g>

  <g id="screenshot" data-pptx-bounds="700 190 480 344">
    <rect x="700" y="190" width="480" height="287" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <image href="../images/06-mode-refactor.png" x="720" y="210" width="440" height="247" preserveAspectRatio="xMidYMid meet"/>
    <rect x="1090" y="416" width="68" height="36" rx="8" fill="none" stroke="#E07B39" stroke-width="2"/>
    <text x="700" y="503" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" fill="#5B6B7C">「マクロを改修する」を選んだ状態。枠は［次へ］</text>
  </g>

  <g id="progress-note" data-pptx-bounds="100 578 1080 40">
    <use data-icon="tabler-filled/circle-arrow-right" x="100" y="582" width="26" height="26" fill="#4A87C4"/>
    <text x="140" y="606" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">選ぶと、画面上部の進捗にその先の手順が現れます。</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="100 684 1080 24">
    <text x="100" y="702" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">第二部 操作マニュアル</text>
    <text x="1180" y="702" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">13</text>
  </g>
</svg>
