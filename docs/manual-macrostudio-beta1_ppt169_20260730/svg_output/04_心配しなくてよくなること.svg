    <text x="72" y="492" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#5B6B7C">元のブックを壊しそう</text>
    <rect x="584" y="446" width="656" height="74" rx="12" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
    <use data-icon="tabler-filled/shield-check" x="612" y="470" width="26" height="26" fill="#2E7D5B"/>
    <text x="652" y="492" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2933">元のファイルには触れない。何度でもやり直せる</text>
  </g>

  <g id="row-5" data-pptx-bounds="40 530 1200 74">
    <rect x="40" y="530" width="520" height="74" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="72" y="576" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#5B6B7C">後で誰も説明できない</text>
    <rect x="584" y="530" width="656" height="74" rx="12" fill="#F4F6F8"/>
    <use data-icon="tabler-filled/folder-open" x="612" y="554" width="26" height="26" fill="#1F4E79"/>
    <text x="652" y="576" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">何を頼み、何が変わったのかが 1 か所に残る</text>
  </g>

  <g id="row-6" data-pptx-bounds="40 614 1200 74">
    <rect x="40" y="614" width="520" height="74" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="72" y="660" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#5B6B7C">部門ごとにやり方が違う</text>
    <rect x="584" y="614" width="656" height="74" rx="12" fill="#F4F6F8"/>
    <use data-icon="tabler-filled/list-check" x="612" y="638" width="26" height="26" fill="#1F4E79"/>
    <text x="652" y="660" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">よく頼む内容は、自分たちのひな形として増やせる</text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="40 694 1200 22">
    <text x="1240" y="710" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">04</text>
  </g>
