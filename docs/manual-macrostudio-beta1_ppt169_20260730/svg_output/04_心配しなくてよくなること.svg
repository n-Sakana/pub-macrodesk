<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="40 44 1200 78">
    <rect x="40" y="50" width="132" height="36" rx="18" fill="#1F4E79"/>
    <text x="106" y="75" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">第一部 · 3</text>
    <text x="190" y="86" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F2933">心配しなくてよくなること</text>
    <text x="1240" y="84" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F4E79">手間も、事故も、あとの説明も、道具の側で受け持つ</text>
    <line x1="40" y1="118" x2="1240" y2="118" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <g id="table-head" data-pptx-bounds="40 140 1200 44">
    <rect x="40" y="140" width="520" height="44" rx="12" fill="#F1F5F9"/>
    <text x="72" y="170" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#5B6B7C">今までの心配</text>
    <rect x="584" y="140" width="656" height="44" rx="12" fill="#1F4E79"/>
    <text x="616" y="170" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">このツールでは</text>
  </g>

  <g id="row-1" data-pptx-bounds="40 194 1200 74">
    <rect x="40" y="194" width="520" height="74" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="72" y="240" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#5B6B7C">何をどう頼めばいいか分からない</text>
    <rect x="584" y="194" width="656" height="74" rx="12" fill="#F4F6F8"/>
    <use data-icon="tabler-filled/file-text" x="612" y="218" width="26" height="26" fill="#1F4E79"/>
    <text x="652" y="240" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">頼みたいことを選べば、依頼文はこちらで用意する</text>
  </g>

  <g id="row-2" data-pptx-bounds="40 278 1200 74">
    <rect x="40" y="278" width="520" height="74" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="72" y="324" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#5B6B7C">コピペを間違えそう</text>
    <rect x="584" y="278" width="656" height="74" rx="12" fill="#F4F6F8"/>
    <use data-icon="tabler-filled/clipboard-check" x="612" y="302" width="26" height="26" fill="#1F4E79"/>
    <text x="652" y="324" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">貼り付けは 1 回だけ。仕分けて写す作業はない</text>
  </g>

  <g id="row-3" data-pptx-bounds="40 362 1200 74">
    <rect x="40" y="362" width="520" height="74" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="72" y="408" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#5B6B7C">直った内容が正しいか分からない</text>
    <rect x="584" y="362" width="656" height="74" rx="12" fill="#F4F6F8"/>
    <use data-icon="tabler-filled/eye" x="612" y="386" width="26" height="26" fill="#1F4E79"/>
    <text x="652" y="408" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">変わった場所を見てから、作るかどうかを決められる</text>
  </g>

  <g id="row-4" data-pptx-bounds="40 446 1200 74">
