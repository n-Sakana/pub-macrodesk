    <image href="../images/16-review-diff.png" x="40" y="148" width="672" height="378" preserveAspectRatio="xMidYMid meet" clip-path="url(#p20-clip)"/>
    <rect x="40" y="148" width="672" height="378" rx="10" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <g id="claim" data-pptx-bounds="36 550 680 102">
    <rect x="36" y="550" width="680" height="102" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
    <use data-icon="tabler-filled/shield-check" x="62" y="572" width="28" height="28" fill="#2E7D5B"/>
    <text x="100" y="594" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="100" dy="0">違うと思ったら［戻る］で取り込み直せます。</tspan><tspan x="100" dy="34">元のブックは何も変わりません。</tspan></text>
  </g>

  <g id="detail" data-pptx-bounds="736 144 504 200">
    <text x="736" y="168" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F4E79"><tspan x="736" dy="0">取り込めた内容が、そのまま</tspan><tspan x="736" dy="34">書き戻す対象です。採用ボタンはありません。</tspan></text>
    <use data-icon="tabler-filled/eye" x="736" y="240" width="26" height="26" fill="#4A87C4"/>
    <text x="774" y="261" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="774" dy="0">左：モジュール一覧。標準 / クラス /</tspan><tspan x="774" dy="34">シートで区分され、+5 −2 のように</tspan><tspan x="774" dy="34">増減行数が出ます。</tspan></text>
  </g>

  <g id="shot-summary" data-pptx-bounds="736 356 288 202">
    <rect x="736" y="356" width="288" height="166" rx="12" fill="#F4F6F8"/>
    <image href="../images/15-review.png" x="740" y="360" width="280" height="158" preserveAspectRatio="xMidYMid meet" clip-path="url(#p20b-clip)"/>
    <rect x="740" y="360" width="280" height="158" rx="8" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <text x="736" y="546" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" fill="#5B6B7C">開く前の要約画面</text>
  </g>

  <g id="detail-2" data-pptx-bounds="1044 356 196 202">
    <use data-icon="tabler-filled/file-diff" x="1044" y="358" width="26" height="26" fill="#4A87C4"/>
    <text x="1044" y="412" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F2933"><tspan x="1044" dy="0">右：インライン差分。</tspan><tspan x="1044" dy="28">削除行は赤、追加行</tspan><tspan x="1044" dy="28">は緑。［変更箇所の</tspan><tspan x="1044" dy="28">み］［折り返し］で</tspan><tspan x="1044" dy="28">絞り込めます。</tspan></text>
  </g>

  <g id="manual-fix" data-pptx-bounds="736 574 504 78">
    <rect x="736" y="574" width="504" height="78" rx="14" fill="#F4F6F8"/>
    <text x="764" y="606" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F2933"><tspan x="764" dy="0">写し間違いなど軽微な修正は</tspan><tspan x="764" dy="28">［手動修正］でその場で直せます。</tspan></text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="40 674 1200 32">
