<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="step-mark" data-pptx-role="decoration" data-pptx-bounds="100 36 100 122">
    <text x="100" y="120" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="96" font-weight="bold" fill="#E2E8F0">1</text>
  </g>

  <g id="header" data-pptx-bounds="200 40 980 120">
    <text x="200" y="62" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" fill="#5B6B7C">手順 1 ・ 1/3</text>
    <text x="200" y="106" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F4E79">Excelブックを読み込みます</text>
    <text x="200" y="150" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="30" fill="#5B6B7C">ドラッグして落とすだけ。まだ何も書き込まれない</text>
  </g>

  <g id="how-to" data-pptx-bounds="100 186 560 118">
    <text x="100" y="214" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="100" dy="0">画面中央へ Excel ファイルを</tspan><tspan x="100" dy="34">ドラッグ＆ドロップします。</tspan><tspan x="100" dy="34">クリックして選ぶこともできます。</tspan></text>
  </g>

  <g id="on-screen-text" data-pptx-bounds="100 304 560 118">
    <text x="100" y="332" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">案内文はこう出ます。</text>
    <rect x="100" y="346" width="6" height="70" rx="3" fill="#CBD5E1"/>
    <text x="128" y="380" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#5B6B7C"><tspan x="128" dy="0">改修したいブックを、ここへ</tspan><tspan x="128" dy="34">ドラッグするか選んでください。</tspan></text>
  </g>

  <g id="after-load" data-pptx-bounds="100 422 560 158">
    <text x="100" y="450" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="100" dy="0">読み込めると、ファイル名と</tspan><tspan x="100" dy="34">パスが表示され、右下の</tspan><tspan x="100" dy="34">［次へ］が青くなります。</tspan></text>
    <text x="100" y="568" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933">選び直したいときは［選び直す］。</text>
  </g>

  <g id="screenshot" data-pptx-bounds="700 220 480 320">
    <rect x="700" y="220" width="480" height="287" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <image href="../images/02-book-loaded.png" x="720" y="240" width="440" height="247" preserveAspectRatio="xMidYMid meet"/>
    <rect x="1090" y="446" width="68" height="36" rx="8" fill="none" stroke="#E07B39" stroke-width="2"/>
    <text x="700" y="533" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" fill="#5B6B7C">読み込めた状態。枠は右下の［次へ］</text>
  </g>

  <g id="pitfall" data-pptx-bounds="100 598 1080 70">
    <rect x="100" y="598" width="1080" height="70" rx="14" fill="#FFFFFF" stroke="#E07B39" stroke-width="2"/>
    <use data-icon="tabler-filled/alert-triangle" x="124" y="618" width="26" height="26" fill="#E07B39"/>
    <text x="164" y="626" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F2933"><tspan x="164" dy="0">マクロを含まないブックを選ぶと「このブックにはマクロが無い」旨のカードが出ます。</tspan><tspan x="164" dy="28">ファイルを間違えていないか確認してください。</tspan></text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="100 684 1080 24">
    <text x="100" y="702" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">第二部 操作マニュアル</text>
    <text x="1180" y="702" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">11</text>
  </g>
</svg>
