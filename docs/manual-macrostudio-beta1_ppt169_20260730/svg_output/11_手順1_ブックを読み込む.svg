<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <clipPath id="p11-clip"><rect x="40" y="148" width="672" height="378" rx="10"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="40 44 1200 78">
    <rect x="40" y="50" width="148" height="36" rx="18" fill="#1F4E79"/>
    <text x="114" y="75" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">手順 1 · 1/3</text>
    <text x="206" y="86" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F2933">Excelブックを読み込みます</text>
    <line x1="40" y1="118" x2="1240" y2="118" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <g id="shot" data-pptx-bounds="36 144 680 386">
    <rect x="36" y="144" width="680" height="386" rx="14" fill="#F4F6F8"/>
    <image href="../images/02-book-loaded.png" x="40" y="148" width="672" height="378" preserveAspectRatio="xMidYMid meet" clip-path="url(#p11-clip)"/>
    <rect x="40" y="148" width="672" height="378" rx="10" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="620" y="452" width="80" height="44" rx="10" fill="none" stroke="#E07B39" stroke-width="3"/>
    <rect x="500" y="404" width="200" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="600" y="427" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" fill="#E07B39">青くなったら次へ</text>
  </g>

  <g id="pitfall" data-pptx-bounds="36 550 680 102">
    <rect x="36" y="550" width="680" height="102" rx="14" fill="#FFFFFF" stroke="#E07B39" stroke-width="2"/>
    <use data-icon="tabler-filled/alert-triangle" x="62" y="572" width="28" height="28" fill="#E07B39"/>
    <text x="100" y="594" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="100" dy="0">マクロを含まないブックを選ぶと、その旨の</tspan><tspan x="100" dy="34">カードが出ます。ファイルを確認してください。</tspan></text>
  </g>

  <g id="steps" data-pptx-bounds="736 144 504 508">
    <circle cx="760" cy="172" r="19" fill="#1F4E79"/>
    <text x="760" y="180" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="796" y="180" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="796" dy="0">画面中央へ Excel ファイルを</tspan><tspan x="796" dy="34">ドラッグ＆ドロップします。</tspan><tspan x="796" dy="34">クリックして選ぶこともできます。</tspan></text>

    <circle cx="760" cy="322" r="19" fill="#1F4E79"/>
    <text x="760" y="330" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="796" y="330" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="796" dy="0">読み込めるとファイル名とパスが</tspan><tspan x="796" dy="34">表示され、右下の［次へ］が</tspan><tspan x="796" dy="34">青くなります。</tspan></text>

    <circle cx="760" cy="472" r="19" fill="#1F4E79"/>
    <text x="760" y="480" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="796" y="480" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="796" dy="0">選び直したいときは</tspan><tspan x="796" dy="34">［選び直す］を押します。</tspan></text>

    <rect x="736" y="566" width="504" height="86" rx="14" fill="#F4F6F8"/>
    <text x="764" y="600" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#5B6B7C">画面に出る案内</text>
    <text x="764" y="632" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F2933">改修したいブックを、ここへドラッグするか選んでください。</text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="40 668 1200 32">
    <text x="40" y="692" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">第二部 操作マニュアル</text>
    <text x="1240" y="692" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">11</text>
  </g>
</svg>
