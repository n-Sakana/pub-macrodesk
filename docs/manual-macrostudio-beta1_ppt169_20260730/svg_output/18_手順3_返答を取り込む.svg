<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <clipPath id="p18-clip"><rect x="40" y="148" width="672" height="378" rx="10"/></clipPath>
    <clipPath id="p18b-clip"><rect x="740" y="466" width="240" height="135" rx="8"/></clipPath>
    <clipPath id="p18c-clip"><rect x="1000" y="466" width="240" height="135" rx="8"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="40 44 1200 78">
    <rect x="40" y="50" width="148" height="36" rx="18" fill="#1F4E79"/>
    <text x="114" y="75" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">手順 3 · 1/2</text>
    <text x="206" y="86" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F2933">AIの返答をまとめて取り込みます</text>
    <line x1="40" y1="118" x2="1240" y2="118" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <g id="shot" data-pptx-bounds="36 144 680 386">
    <rect x="36" y="144" width="680" height="386" rx="14" fill="#F4F6F8"/>
    <image href="../images/12-intake.png" x="40" y="148" width="672" height="378" preserveAspectRatio="xMidYMid meet" clip-path="url(#p18-clip)"/>
    <rect x="40" y="148" width="672" height="378" rx="10" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <g id="claim" data-pptx-bounds="36 550 680 102">
    <rect x="36" y="550" width="680" height="102" rx="14" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
    <use data-icon="tabler-filled/clipboard-check" x="62" y="572" width="28" height="28" fill="#2E7D5B"/>
    <text x="100" y="594" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2933"><tspan x="100" dy="0">モジュールを選ぶ必要も、</tspan><tspan x="100" dy="34">1 つずつ貼る必要もありません。</tspan></text>
  </g>

  <g id="steps" data-pptx-bounds="736 144 504 300">
    <circle cx="760" cy="172" r="19" fill="#1F4E79"/>
    <text x="760" y="180" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="796" y="180" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="796" dy="0">AI は、変更したモジュールと</tspan><tspan x="796" dy="34">新しく作ったモジュールの全文を</tspan><tspan x="796" dy="34">1 つのコードブロックで返します。</tspan></text>

    <circle cx="760" cy="322" r="19" fill="#1F4E79"/>
    <text x="760" y="330" text-anchor="middle" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="796" y="330" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" fill="#1F2933"><tspan x="796" dy="0">それをコピーして、［クリップボード</tspan><tspan x="796" dy="34">からAIの返答を取り込む］を 1 回。</tspan><tspan x="796" dy="34">Ctrl+V でも同じです。</tspan></text>
  </g>

  <g id="shot-result" data-pptx-bounds="736 462 248 200">
    <rect x="736" y="462" width="248" height="143" rx="12" fill="#F4F6F8"/>
    <image href="../images/13-intake-done.png" x="740" y="466" width="240" height="135" preserveAspectRatio="xMidYMid meet" clip-path="url(#p18b-clip)"/>
    <rect x="740" y="466" width="240" height="135" rx="8" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <text x="736" y="628" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" fill="#5B6B7C"><tspan x="736" dy="0">取り込み結果。既存・新規</tspan><tspan x="736" dy="22">の内訳も出ます</tspan></text>
  </g>

  <g id="shot-summary" data-pptx-bounds="996 462 248 200">
    <rect x="996" y="462" width="248" height="143" rx="12" fill="#F4F6F8"/>
    <image href="../images/14-intake-summary.png" x="1000" y="466" width="240" height="135" preserveAspectRatio="xMidYMid meet" clip-path="url(#p18c-clip)"/>
    <rect x="1000" y="466" width="240" height="135" rx="8" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <text x="996" y="628" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" fill="#5B6B7C"><tspan x="996" dy="0">「AIが書いた改修内容を</tspan><tspan x="996" dy="22">見る」で日本語で読めます</tspan></text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="40 674 1200 32">
    <text x="40" y="698" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">第二部 操作マニュアル</text>
    <text x="1240" y="698" text-anchor="end" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" fill="#5B6B7C">18</text>
  </g>
</svg>
