    <rect x="472" y="482" width="708" height="36" rx="10" fill="#1F4E79" />
    <text x="496" y="507" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">対処</text>

    <rect x="100" y="524" width="360" height="34" rx="8" fill="#F1F5F9" />
    <text x="124" y="548" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F2933">起動しない・白い画面のまま</text>
    <text x="496" y="548" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F2933">WebView2 ランタイムが未導入の可能性。起動時のエラー案内に従う</text>

    <rect x="100" y="562" width="360" height="34" rx="8" fill="#F1F5F9" />
    <text x="124" y="586" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F2933">返答を取り込めない</text>
    <text x="496" y="586" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F2933">コードブロック全体（区切り行を含む）をコピーし直す</text>

    <rect x="100" y="600" width="360" height="34" rx="8" fill="#F1F5F9" />
    <text x="124" y="624" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F2933">ひな形が一覧に出ない</text>
    <text x="496" y="624" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F2933">その Markdown の見出しが揃っているか確認する。画面に理由が出る</text>

    <rect x="100" y="638" width="360" height="34" rx="8" fill="#F1F5F9" />
    <text x="124" y="662" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F2933">ビルドに失敗した</text>
    <text x="496" y="662" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" fill="#1F2933">画面の指示に従う。元のファイルは変更されていないので何度でもやり直せる</text>
