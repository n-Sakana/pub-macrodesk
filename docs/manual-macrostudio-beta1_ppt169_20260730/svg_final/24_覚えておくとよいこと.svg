    <text x="164" y="206" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#1F4E79">増やせるのは標準モジュールだけ</text>
    <text fill="#1F2933" font-size="20" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="124" y="248">既存のクラスモジュールやシートのモジュールを</text><text fill="#1F2933" font-size="20" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="124" y="276">直すことはできます。新しいクラスやユーザー</text><text fill="#1F2933" font-size="20" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="124" y="304">フォームを含む返答は取り込みません。</text></g>

