    <text x="724" y="206" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="20" font-weight="bold" fill="#1F4E79">ひな形は自分で増やせる</text>
    <text fill="#1F2933" font-size="20" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="684" y="248">presets フォルダに Markdown ファイル</text><text fill="#1F2933" font-size="20" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="684" y="276">（UTF-8）を置くと、ファイル 1 つにつき</text><text fill="#1F2933" font-size="20" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="684" y="304">1 件、目的の画面に自動で現れます。</text></g>

  <g id="preset-rules" data-pptx-bounds="100 326 1080 128">
    <text fill="#1F2933" font-size="20" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="100" y="348">・最初の「# ...」が一覧に出る名前です。アプリの再起動は不要です。</text><text fill="#1F2933" font-size="20" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="100" y="376">・「## 用途」に「改修」か「診断」と書くと、その使いかたの一覧に並びます（省略すると改修）。</text><text fill="#1F2933" font-size="20" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="100" y="404">・「## 質問」を書くと、1 問ずつ質問する画面が出ます。</text><text fill="#1F2933" font-size="20" font-family="'Yu Gothic UI','Segoe UI',sans-serif" x="100" y="432">・書式が足りないファイルは選べず、理由付きで一覧の下に出ます。</text></g>

