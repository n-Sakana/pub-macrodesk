    <text fill="#5B6B7C" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" x="72" y="576">画面は MacroStudio ベータ版 1.0.0 のものです。ベータ版のため、画面の文言や配置は今後変わることがあります。</text><text fill="#5B6B7C" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" x="72" y="606">掲載しているスクリーンショットは、サンプルのブック（受注管理.xlsm）を読み込んだ実画面です。</text><text fill="#5B6B7C" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" x="72" y="636">フォルダのパスや日時は説明用の例です。判断は AI が行います。最後に Excel で開いて動作を確認するのは人です。</text></g>

