    <use data-icon="tabler-filled/circle-number-4" x="68" y="504" width="48" height="48" fill="#2B5C96"/>
    <use data-icon="tabler-filled/circle-check" x="136" y="512" width="32" height="32" fill="#2B5C96"/>
