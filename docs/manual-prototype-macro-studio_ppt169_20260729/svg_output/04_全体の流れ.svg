    <use data-icon="tabler-filled/file-upload" x="136" y="176" width="32" height="32" fill="#2B5C96"/>
    <text x="182" y="186" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="32" font-weight="bold" fill="#1F2A37">ブックを読み込む</text>
    <text x="182" y="220" font-family="'Meiryo','Segoe UI',sans-serif" font-size="18" fill="#5D6B7A">2 画面</text>
    <line x1="500" y1="166" x2="500" y2="218" stroke="#E2E7EC" stroke-width="1"/>
    <text x="532" y="200" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">どのブックを改修するかを決めます</text>
  </g>

