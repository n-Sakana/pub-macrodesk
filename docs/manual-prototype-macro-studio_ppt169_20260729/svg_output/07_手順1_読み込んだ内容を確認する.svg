<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <clipPath id="shot-clip"><rect x="40" y="148" width="672" height="378" rx="10"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="40 44 1200 78">
    <rect x="40" y="50" width="148" height="36" rx="18" fill="#2B5C96"/>
    <text x="114" y="75" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">手順 1 · 2/2</text>
    <text x="206" y="86" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F2A37">読み込んだマクロを確認します</text>
    <line x1="40" y1="118" x2="1240" y2="118" stroke="#E2E7EC" stroke-width="1"/>
  </g>

  <g id="shot" data-pptx-bounds="36 144 680 386">
    <rect x="36" y="144" width="680" height="386" rx="14" fill="#F4F6F8"/>
    <image href="../images/s02-book-loaded.png" x="40" y="148" width="672" height="378" preserveAspectRatio="xMidYMid meet" clip-path="url(#shot-clip)"/>
    <rect x="40" y="148" width="672" height="378" rx="10" fill="none" stroke="#E2E7EC" stroke-width="1"/>
    <circle cx="138" cy="341" r="17" fill="#2B5C96" stroke="#FFFFFF" stroke-width="3"/>
    <text x="138" y="348" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <circle cx="489" cy="341" r="17" fill="#2B5C96" stroke="#FFFFFF" stroke-width="3"/>
    <text x="489" y="348" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <circle cx="552" cy="341" r="17" fill="#2B5C96" stroke="#FFFFFF" stroke-width="3"/>
    <text x="552" y="348" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <circle cx="615" cy="341" r="17" fill="#2B5C96" stroke="#FFFFFF" stroke-width="3"/>
    <text x="615" y="348" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  </g>

  <g id="shot-note" data-pptx-bounds="36 550 680 102">
    <rect x="36" y="550" width="680" height="102" rx="14" fill="#F2F6FB"/>
    <text x="66" y="594" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">下に並ぶのがモジュール名です。違うブックだった<tspan x="66" dy="34">ら［別のブックを選ぶ］でやり直せます。</tspan></text>
  </g>

  <g id="steps" data-pptx-bounds="736 144 504 508">
    <circle cx="760" cy="172" r="17" fill="#2B5C96"/>
    <text x="760" y="179" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="792" y="180" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">ファイル名とパス<tspan x="792" dy="34">意図したブックか確認します。</tspan></text>
    <circle cx="760" cy="290" r="17" fill="#2B5C96"/>
    <text x="760" y="297" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="792" y="298" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">モジュール<tspan x="792" dy="34">読み込んだモジュールの数です。</tspan></text>
    <circle cx="760" cy="408" r="17" fill="#2B5C96"/>
    <text x="760" y="415" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="792" y="416" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">合計行数<tspan x="792" dy="34">全モジュールの合計行数です。</tspan></text>
    <circle cx="760" cy="526" r="17" fill="#2B5C96"/>
    <text x="760" y="533" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="792" y="534" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">読み取り警告<tspan x="792" dy="34">「あり」でも、読める範囲で</tspan><tspan x="792" dy="34">処理は続きます。</tspan></text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="40 668 1200 32">
    <text x="40" y="692" font-family="'Meiryo','Segoe UI',sans-serif" font-size="16" fill="#5D6B7A">Macro Studio（仮称）操作マニュアル 試作版</text>
    <text x="1240" y="692" font-family="'Meiryo','Segoe UI',sans-serif" font-size="16" fill="#5D6B7A" text-anchor="end">07</text>
  </g>
