<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <clipPath id="before-clip"><rect x="40" y="160" width="530" height="298" rx="10"/></clipPath>
    <clipPath id="after-clip"><rect x="710" y="160" width="530" height="298" rx="10"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="40 44 1200 78">
    <rect x="40" y="50" width="148" height="36" rx="18" fill="#2B5C96"/>
    <text x="114" y="75" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">手順 3 · 1/3</text>
    <text x="206" y="86" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F2A37">AIの返答からモジュールごとに取り込みます</text>
    <line x1="40" y1="118" x2="1240" y2="118" stroke="#E2E7EC" stroke-width="1"/>
  </g>

  <g id="shot-before" data-pptx-bounds="40 128 530 330">
    <text x="40" y="150" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#5D6B7A">貼る前</text>
    <image href="../images/s07-intake.png" x="40" y="160" width="530" height="298" preserveAspectRatio="xMidYMid meet" clip-path="url(#before-clip)"/>
    <rect x="40" y="160" width="530" height="298" rx="10" fill="none" stroke="#E2E7EC" stroke-width="1"/>
  </g>

  <g id="intake-flow-arrow" data-pptx-bounds="600 281 80 56">
    <g id="p13-intake-arrow" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="rightArrow" data-pptx-frame="600 281 80 56" fill="#2B5C96" stroke="none">
      <path d="M 600 295 L 652 295 L 652 281 L 680 309 L 652 337 L 652 323 L 600 323 Z"/>
    </g>
  </g>

  <g id="shot-after" data-pptx-bounds="710 128 530 330">
    <text x="710" y="150" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#4C9155">貼ったあと</text>
    <image href="../images/s08-intake-done.png" x="710" y="160" width="530" height="298" preserveAspectRatio="xMidYMid meet" clip-path="url(#after-clip)"/>
    <rect x="710" y="160" width="530" height="298" rx="10" fill="none" stroke="#4C9155" stroke-width="2"/>
  </g>

  <g id="steps-left" data-pptx-bounds="40 474 588 148">
    <circle cx="62" cy="490" r="17" fill="#2B5C96"/>
    <text x="62" y="497" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="94" y="498" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">AI の返答の「改修サマリー」で、<tspan x="94" dy="32">変更されたモジュール名を確認します。</tspan></text>
    <circle cx="62" cy="578" r="17" fill="#2B5C96"/>
    <text x="62" y="585" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="94" y="586" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">左の一覧からそのモジュールを選び<tspan x="94" dy="32">ます。選ぶ場所はここだけです。</tspan></text>
  </g>

  <g id="steps-right" data-pptx-bounds="652 474 588 148">
    <circle cx="674" cy="490" r="17" fill="#2B5C96"/>
    <text x="674" y="497" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="706" y="498" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">返答のコードブロックを、先頭から<tspan x="706" dy="32">末尾まで全文コピーします。</tspan></text>
    <circle cx="674" cy="578" r="17" fill="#2B5C96"/>
    <text x="674" y="585" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="706" y="586" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">［クリップボードから取り込む］を<tspan x="706" dy="32">押します。Ctrl+V でも貼れます。</tspan></text>
  </g>

  <g id="normalize-note" data-pptx-bounds="40 632 1200 26">
    <text x="40" y="650" font-family="'Meiryo','Segoe UI',sans-serif" font-size="18" fill="#5D6B7A">貼り付けたテキストは自動で整えられます。行頭の ``` や、先頭の「Attribute VB_」で始まる行は取り除かれます。</text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="40 668 1200 32">
    <text x="40" y="692" font-family="'Meiryo','Segoe UI',sans-serif" font-size="16" fill="#5D6B7A">Macro Studio（仮称）操作マニュアル 試作版</text>
    <text x="1240" y="692" font-family="'Meiryo','Segoe UI',sans-serif" font-size="16" fill="#5D6B7A" text-anchor="end">13</text>
  </g>
</svg>
