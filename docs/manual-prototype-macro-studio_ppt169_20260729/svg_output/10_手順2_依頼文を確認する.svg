<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <clipPath id="shot-clip"><rect x="40" y="148" width="672" height="378" rx="10"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="40 44 1200 78">
    <rect x="40" y="50" width="148" height="36" rx="18" fill="#2B5C96"/>
    <text x="114" y="75" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">手順 2 · 3/4</text>
    <text x="206" y="86" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F2A37">AIへ伝える改修内容を確認します</text>
    <line x1="40" y1="118" x2="1240" y2="118" stroke="#E2E7EC" stroke-width="1"/>
  </g>

  <g id="shot" data-pptx-bounds="36 144 680 386">
    <rect x="36" y="144" width="680" height="386" rx="14" fill="#F4F6F8"/>
    <image href="../images/s05-request-editor.png" x="40" y="148" width="672" height="378" preserveAspectRatio="xMidYMid meet" clip-path="url(#shot-clip)"/>
    <rect x="40" y="148" width="672" height="378" rx="10" fill="none" stroke="#E2E7EC" stroke-width="1"/>
    <circle cx="130" cy="280" r="17" fill="#2B5C96" stroke="#FFFFFF" stroke-width="3"/>
    <text x="130" y="287" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <circle cx="635" cy="240" r="17" fill="#2B5C96" stroke="#FFFFFF" stroke-width="3"/>
    <text x="635" y="247" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <circle cx="130" cy="472" r="17" fill="#2B5C96" stroke="#FFFFFF" stroke-width="3"/>
    <text x="130" y="479" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  </g>

  <g id="shot-note" data-pptx-bounds="36 550 680 102">
    <rect x="36" y="550" width="680" height="102" rx="14" fill="#F2F6FB"/>
    <use data-icon="tabler-filled/edit" x="62" y="572" width="28" height="28" fill="#2B5C96"/>
    <text x="100" y="594" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">前の画面で「自分で書く」を選んだ場合、<tspan x="100" dy="34">出力指示は付きません。</tspan></text>
  </g>

  <g id="steps" data-pptx-bounds="736 144 504 508">
    <circle cx="760" cy="180" r="17" fill="#2B5C96"/>
    <text x="760" y="187" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="792" y="188" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">ひな形の「改修指示」が入った<tspan x="792" dy="34">状態で出ます。そのまま使って</tspan><tspan x="792" dy="34">も、自分の言葉を足しても、</tspan><tspan x="792" dy="34">消してもかまいません。</tspan></text>
    <circle cx="760" cy="360" r="17" fill="#2B5C96"/>
    <text x="760" y="367" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="792" y="368" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">文字数が右上に出ます。</text>
    <circle cx="760" cy="446" r="17" fill="#2B5C96"/>
    <text x="760" y="453" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="792" y="454" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">下の「出力指示」は、返答の<tspan x="792" dy="34">しかたを AI に伝える文です。</tspan><tspan x="792" dy="34">クリックすると読めます。この</tspan><tspan x="792" dy="34">文は依頼文の末尾に自動で</tspan><tspan x="792" dy="34">付いて送られます。</tspan></text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="40 668 1200 32">
    <text x="40" y="692" font-family="'Meiryo','Segoe UI',sans-serif" font-size="16" fill="#5D6B7A">Macro Studio（仮称）操作マニュアル 試作版</text>
