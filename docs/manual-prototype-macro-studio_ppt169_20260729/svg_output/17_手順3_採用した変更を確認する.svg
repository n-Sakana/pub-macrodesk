<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <clipPath id="shot-clip"><rect x="40" y="148" width="672" height="378" rx="10"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="40 44 1200 78">
    <rect x="40" y="50" width="148" height="36" rx="18" fill="#2B5C96"/>
    <text x="114" y="75" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">手順 3 · 3/3</text>
    <text x="206" y="86" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F2A37">採用した変更を確認します</text>
    <line x1="40" y1="118" x2="1240" y2="118" stroke="#E2E7EC" stroke-width="1"/>
  </g>

  <g id="shot" data-pptx-bounds="36 144 680 386">
    <rect x="36" y="144" width="680" height="386" rx="14" fill="#F4F6F8"/>
    <image href="../images/s11-accepted-summary.png" x="40" y="148" width="672" height="378" preserveAspectRatio="xMidYMid meet" clip-path="url(#shot-clip)"/>
    <rect x="40" y="148" width="672" height="378" rx="10" fill="none" stroke="#E2E7EC" stroke-width="1"/>
    <circle cx="169" cy="312" r="17" fill="#2B5C96" stroke="#FFFFFF" stroke-width="3"/>
    <text x="169" y="319" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <circle cx="307" cy="312" r="17" fill="#2B5C96" stroke="#FFFFFF" stroke-width="3"/>
    <text x="307" y="319" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <circle cx="445" cy="312" r="17" fill="#2B5C96" stroke="#FFFFFF" stroke-width="3"/>
    <text x="445" y="319" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <circle cx="583" cy="312" r="17" fill="#2B5C96" stroke="#FFFFFF" stroke-width="3"/>
    <text x="583" y="319" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  </g>

  <g id="shot-note" data-pptx-bounds="36 550 680 102">
    <rect x="36" y="550" width="680" height="102" rx="14" fill="#F2F6FB"/>
    <text x="66" y="594" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">まだ取り込むものがあれば［別のモジュールを<tspan x="66" dy="34">取り込む］で戻れます。</tspan></text>
  </g>

  <g id="steps" data-pptx-bounds="736 144 504 508">
    <circle cx="760" cy="172" r="17" fill="#4C9155"/>
    <text x="760" y="179" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="792" y="180" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#4C9155">書き戻し</text>
    <text x="792" y="216" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">採用したモジュールの数。<tspan x="792" dy="34">これがビルドで書き込まれます。</tspan></text>
    <circle cx="760" cy="300" r="17" fill="#2B5C96"/>
    <text x="760" y="307" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="792" y="308" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2A37">変更なし</text>
    <text x="792" y="344" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">元と同じだった、または対象外<tspan x="792" dy="34">にしたモジュール。</tspan></text>
    <circle cx="760" cy="428" r="17" fill="#2B5C96"/>
    <text x="760" y="435" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="792" y="436" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2A37">未処理</text>
    <text x="792" y="472" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">まだ決めていないモジュール。</text>
    <circle cx="760" cy="522" r="17" fill="#2B5C96"/>
    <text x="760" y="529" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="792" y="530" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2A37">追加・削除</text>
    <text x="792" y="566" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">採用した変更の合計行数。</text>
    <text x="736" y="628" font-family="'Meiryo','Segoe UI',sans-serif" font-size="18" fill="#5D6B7A">1 件以上採用していれば［次へ］が押せます。</text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="40 668 1200 32">
    <text x="40" y="692" font-family="'Meiryo','Segoe UI',sans-serif" font-size="16" fill="#5D6B7A">Macro Studio（仮称）操作マニュアル 試作版</text>
    <text x="1240" y="692" font-family="'Meiryo','Segoe UI',sans-serif" font-size="16" fill="#5D6B7A" text-anchor="end">17</text>
  </g>
</svg>
