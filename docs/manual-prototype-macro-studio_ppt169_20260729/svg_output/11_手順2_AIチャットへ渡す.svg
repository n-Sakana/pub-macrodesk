<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <clipPath id="shot-clip"><rect x="40" y="148" width="672" height="378" rx="10"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-bounds="40 44 1200 78">
    <rect x="40" y="50" width="148" height="36" rx="18" fill="#2B5C96"/>
    <text x="114" y="75" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">手順 2 · 4/4</text>
    <text x="206" y="86" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="42" font-weight="bold" fill="#1F2A37">AIチャットへ改修を依頼します</text>
    <line x1="40" y1="118" x2="1240" y2="118" stroke="#E2E7EC" stroke-width="1"/>
  </g>

  <g id="shot" data-pptx-bounds="36 144 680 386">
    <rect x="36" y="144" width="680" height="386" rx="14" fill="#F4F6F8"/>
    <image href="../images/s06-handoff.png" x="40" y="148" width="672" height="378" preserveAspectRatio="xMidYMid meet" clip-path="url(#shot-clip)"/>
    <rect x="40" y="148" width="672" height="378" rx="10" fill="none" stroke="#E2E7EC" stroke-width="1"/>
    <circle cx="125" cy="290" r="17" fill="#2B5C96" stroke="#FFFFFF" stroke-width="3"/>
    <text x="125" y="297" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <circle cx="404" cy="290" r="17" fill="#2B5C96" stroke="#FFFFFF" stroke-width="3"/>
    <text x="404" y="297" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <circle cx="125" cy="404" r="17" fill="#2B5C96" stroke="#FFFFFF" stroke-width="3"/>
    <text x="125" y="411" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  </g>

  <g id="shot-note" data-pptx-bounds="36 550 680 102">
    <rect x="36" y="550" width="680" height="102" rx="14" fill="#FFFFFF" stroke="#2B5C96" stroke-width="2"/>
    <text x="66" y="584" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#2B5C96">なぜ 2 つに分けるのか</text>
    <text x="66" y="622" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">添付ファイル内で指示文とコードが混ざると、AI が</text>
    <text x="66" y="648" font-family="'Meiryo','Segoe UI',sans-serif" font-size="18" fill="#5D6B7A">「コード全文を取得できない」と誤って判断することが実際にありました。</text>
  </g>

  <g id="steps" data-pptx-bounds="736 144 504 508">
    <circle cx="760" cy="180" r="17" fill="#2B5C96"/>
    <text x="760" y="187" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <use data-icon="tabler-filled/copy" x="792" y="164" width="28" height="28" fill="#2B5C96"/>
    <text x="830" y="188" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2A37">［依頼文をコピー］</text>
    <text x="792" y="230" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">依頼文がクリップボードへ<tspan x="792" dy="34">入ります。コード本文は</tspan><tspan x="792" dy="34">コピーされません。</tspan></text>
    <circle cx="760" cy="340" r="17" fill="#2B5C96"/>
    <text x="760" y="347" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <use data-icon="tabler-filled/file-code" x="792" y="324" width="28" height="28" fill="#2B5C96"/>
    <text x="830" y="348" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2A37">［ファイルの場所を開く］</text>
    <text x="792" y="390" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">エクスプローラーが<tspan x="792" dy="34">source-code.md を選んだ</tspan><tspan x="792" dy="34">状態で開きます。これを</tspan><tspan x="792" dy="34">チャットへ添付します。</tspan></text>
    <circle cx="760" cy="534" r="17" fill="#2B5C96"/>
    <text x="760" y="541" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="792" y="542" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">両方が緑のチェックになると<tspan x="792" dy="34">［次へ］が押せます。</tspan></text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="40 668 1200 32">
    <text x="40" y="692" font-family="'Meiryo','Segoe UI',sans-serif" font-size="16" fill="#5D6B7A">Macro Studio（仮称）操作マニュアル 試作版</text>
    <text x="1240" y="692" font-family="'Meiryo','Segoe UI',sans-serif" font-size="16" fill="#5D6B7A" text-anchor="end">11</text>
  </g>
</svg>
