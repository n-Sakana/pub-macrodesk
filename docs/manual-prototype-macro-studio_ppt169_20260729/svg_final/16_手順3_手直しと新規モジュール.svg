    <text x="114" y="248" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="32" font-weight="bold" fill="#2B5C96">［手動修正］</text>
    <text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="68" y="294">コードフェンスが混ざった、行が欠けた</text><text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="68" y="328">といった軽微な写し間違いは、AI へ戻ら</text><text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="68" y="362">ずここで直せます。</text><circle cx="86" cy="410" r="15" fill="#2B5C96" />
    <text x="86" y="416" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="114" y="418" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">押すと右側が編集欄になります。</text>
    <circle cx="86" cy="464" r="15" fill="#2B5C96" />
    <text x="86" y="470" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="114" y="472">直して［修正を反映］を押すと、</text><text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="114" y="506">差分を見直せます。</text><circle cx="86" cy="552" r="15" fill="#2B5C96" />
    <text x="86" y="558" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="114" y="560">未反映のまま画面を離れようと</text><text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="114" y="594">すると、確認が出ます。</text></g>

