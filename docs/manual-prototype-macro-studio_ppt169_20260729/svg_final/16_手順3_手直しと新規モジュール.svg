    <text x="726" y="248" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="32" font-weight="bold" fill="#4C9155">［AIが追加したモジュール］</text>
    <text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="680" y="294">AI が新しい標準モジュールを返した</text><text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="680" y="328">ときに使います。</text><circle cx="698" cy="376" r="15" fill="#4C9155" />
    <text x="698" y="382" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="726" y="384">左の一覧の下にあるボタンを</text><text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="726" y="418">押します（取り込みの画面で</text><text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="726" y="452">のみ押せます）。</text><circle cx="698" cy="486" r="15" fill="#4C9155" />
    <text x="698" y="492" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="726" y="494">返答のコードブロックをコピー</text><text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="726" y="528">しておきます。</text><circle cx="698" cy="544" r="15" fill="#4C9155" />
    <text x="698" y="550" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="726" y="552">モジュール名を入力して</text><text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="726" y="586">［新規モジュールとして取り込む］。</text></g>

  <g id="limit-band" data-pptx-bounds="40 614 1200 44">
