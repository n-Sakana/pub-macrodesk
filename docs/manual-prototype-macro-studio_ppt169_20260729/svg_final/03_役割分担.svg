    <text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="376" y="354">マクロのコードを取り出す。依頼文とコードを渡せる形にする。</text><text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="376" y="390">採用した変更だけを、新しいブックへ書き戻す。</text></g>

