    <text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="376" y="206">どのブックを直すか決める。何を直したいかを言葉にする。</text><text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="376" y="242">AIの変更を採用するかどうかを決める。</text></g>

