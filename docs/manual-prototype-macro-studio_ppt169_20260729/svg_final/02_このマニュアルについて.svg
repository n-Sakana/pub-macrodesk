    <text x="122" y="452" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="32" font-weight="bold" fill="#A2701C">これは試作です</text>
    <text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="76" y="510">製品名は「Macro Studio（仮称）」です。アプリ画面・ロゴ・ログの保存先は開発中のため</text><text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="76" y="546">MacroDesk のままで、これから出てくる画面写真にもそのまま写ります。</text><text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="76" y="592">画面写真はアプリ同梱のデモ用データを表示したものです。ブック名・行数・日時は</text><text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="76" y="628">実在の業務データではありません。</text></g>

