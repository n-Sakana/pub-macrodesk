    <text x="700" y="372" font-family="'Meiryo','Segoe UI',sans-serif" font-size="18" fill="#5D6B7A">どのモジュールをどう変えたかの箇条書き</text>
    <rect x="680" y="396" width="532" height="72" rx="10" fill="#F4F6F8" />
    <text x="700" y="428" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#1F2A37">■ モジュール名</text>
    <text x="700" y="456" font-family="'Meiryo','Segoe UI',sans-serif" font-size="18" fill="#5D6B7A">改修後コード全文のコードブロック</text>
    <text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="680" y="512">まず「改修サマリー」を読みます。</text><text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="680" y="546">これが、このあとの取り込み作業の</text><text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="680" y="580">指示書を兼ねます。</text><text fill="#5D6B7A" font-family="'Meiryo','Segoe UI',sans-serif" font-size="18" x="680" y="614">新しいモジュールは「■ 名前（新規）」。</text><text fill="#5D6B7A" font-family="'Meiryo','Segoe UI',sans-serif" font-size="18" x="680" y="640">変更していないモジュールは返りません。</text></g>

