    <circle cx="86" cy="310" r="17" fill="#2B5C96" />
    <text x="86" y="317" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="118" y="318">チャットの入力欄に依頼文を</text><text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="118" y="352">貼り付けます（Ctrl+V）。</text><circle cx="86" cy="420" r="17" fill="#2B5C96" />
    <text x="86" y="427" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="118" y="428">同じメッセージに</text><text fill="#1F2A37" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" x="118" y="462">source-code.md を添付します。</text><circle cx="86" cy="530" r="17" fill="#2B5C96" />
    <text x="86" y="537" font-family="'Yu Gothic UI','Segoe UI',sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="118" y="538" font-family="'Meiryo','Segoe UI',sans-serif" font-size="24" fill="#1F2A37">送信して、返答を待ちます。</text>
    <text x="68" y="612" font-family="'Meiryo','Segoe UI',sans-serif" font-size="18" fill="#5D6B7A">うまくいかないときは、前の画面へ戻って依頼を言い直せます。</text>
