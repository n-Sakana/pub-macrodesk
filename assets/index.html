<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MacroDesk</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/module-list.css">
  <link rel="stylesheet" href="css/lecture.css">
  <link rel="stylesheet" href="css/steps.css">
  <link rel="stylesheet" href="css/diff.css">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("macrodesk.theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (error) {
      }
    }());
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">メイン画面へ移動</a>

  <div class="app-shell" id="app-shell">
    <header class="progress-region">
      <div class="brand" aria-label="MacroDesk">
        <span class="brand-mark" aria-hidden="true">MD</span>
        <span class="brand-name">MacroDesk</span>
      </div>

      <nav class="progress-nav" aria-label="改修の進捗">
        <ol class="progress-list">
          <li class="progress-item">
            <button class="progress-step" type="button" data-step="1">
              <span class="progress-number">1</span>
              <span class="progress-label">添付</span>
            </button>
          </li>
          <li class="progress-item">
            <button class="progress-step" type="button" data-step="2">
              <span class="progress-number">2</span>
              <span class="progress-label">依頼作成</span>
            </button>
          </li>
          <li class="progress-item">
            <button class="progress-step" type="button" data-step="3">
              <span class="progress-number">3</span>
              <span class="progress-label">取り込み</span>
            </button>
          </li>
          <li class="progress-item">
            <button class="progress-step" type="button" data-step="4">
              <span class="progress-number">4</span>
              <span class="progress-label">ビルド</span>
            </button>
          </li>
        </ol>
      </nav>

      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="テーマを切り替える（現在: ライト）"
        title="テーマを切り替える（現在: ライト）">
        <svg class="theme-icon theme-icon--moon" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6 6 0 1 0 8 8Z"></path>
        </svg>
        <svg class="theme-icon theme-icon--sun" viewBox="0 0 20 20" aria-hidden="true" hidden>
          <circle cx="10" cy="10" r="3.25"></circle>
          <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.35 4.35l1.4 1.4M14.25 14.25l1.4 1.4M15.65 4.35l-1.4 1.4M5.75 14.25l-1.4 1.4"></path>
        </svg>
      </button>
    </header>

    <aside class="module-region" aria-labelledby="module-heading">
      <div class="module-header">
        <div>
          <h1 id="module-heading">モジュール</h1>
        </div>
        <span class="module-count" id="module-count" aria-label="0 モジュール">0</span>
      </div>
      <div class="book-summary">
        <span class="book-indicator" aria-hidden="true"></span>
        <span class="book-name" id="book-name">ブック未添付</span>
      </div>
      <ul class="module-list" id="module-list" aria-label="VBA モジュール一覧"></ul>
      <div class="module-empty" id="module-empty">
        <span class="module-empty-mark" aria-hidden="true">VBA</span>
        <p>ブックを添付すると、ここにモジュールが並びます。</p>
      </div>
    </aside>

    <div class="work-region" id="work-region">
      <main class="main-region" id="main-content" tabindex="-1"></main>

      <aside class="lecture-region" id="lecture-panel" aria-labelledby="lecture-title">
        <button class="lecture-toggle" id="lecture-toggle" type="button" aria-expanded="true">
          <span class="lecture-heading-group">
            <svg class="lecture-icon" viewBox="0 0 20 20" aria-hidden="true">
              <path d="M4 3.5h9.5A2.5 2.5 0 0 1 16 6v8.5H6.5A2.5 2.5 0 0 0 4 17V3.5Z"></path>
              <path d="M4 14.5h9.5A2.5 2.5 0 0 1 16 17"></path>
            </svg>
            <span class="lecture-label">操作ガイド</span>
            <span class="lecture-branch" id="lecture-branch"></span>
          </span>
          <svg class="lecture-chevron" viewBox="0 0 20 20" aria-hidden="true">
            <path d="m6 8 4 4 4-4"></path>
          </svg>
        </button>
        <div class="lecture-content" id="lecture-content">
          <h2 id="lecture-title"></h2>
          <p id="lecture-body"></p>
          <p class="lecture-next-action" id="lecture-next-action" hidden></p>
        </div>
      </aside>
    </div>
  </div>

  <dialog class="discard-modal" id="discard-modal" aria-labelledby="discard-modal-title">
    <div class="discard-modal-content">
      <h2 id="discard-modal-title">取り込み済みの内容を破棄しますか？</h2>
      <p>別のブックを添付すると、現在取り込んでいる変更は破棄されます。</p>
      <div class="step-actions">
        <button
          class="action-button action-button--secondary"
          id="discard-modal-cancel"
          type="button">キャンセル</button>
        <button
          class="action-button action-button--danger"
          id="discard-modal-confirm"
          type="button">破棄して添付する</button>
      </div>
    </div>
  </dialog>

  <dialog class="discard-modal" id="edit-discard-modal" aria-labelledby="edit-discard-modal-title">
    <div class="discard-modal-content">
      <h2 id="edit-discard-modal-title">未反映の修正を破棄しますか？</h2>
      <p>手動修正でまだ反映していない変更があります。このまま進むと破棄されます。</p>
      <div class="step-actions">
        <button
          class="action-button action-button--secondary"
          id="edit-discard-cancel"
          type="button">編集に戻る</button>
        <button
          class="action-button action-button--danger"
          id="edit-discard-confirm"
          type="button">破棄して続行</button>
      </div>
    </div>
  </dialog>

  <div class="status-announcer" id="status-announcer" aria-live="polite"></div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script src="js/theme.js"></script>
  <script src="js/host-bridge.js"></script>
  <script src="js/prompt-template.js"></script>
  <script src="js/diff.js"></script>
  <script src="js/vba-highlight.js"></script>
  <script src="js/diff-report.js"></script>
  <script src="js/diff-view.js"></script>
  <script src="js/state.js"></script>
  <script src="js/lecture.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
